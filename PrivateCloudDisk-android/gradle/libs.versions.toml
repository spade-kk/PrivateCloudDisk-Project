[versions]
agp = "8.7.0"
kotlin = "2.0.0"
# AndroidX Core
coreKtx = "1.15.0"
activity = "1.9.3"
fragment = "1.8.6"
appcompat = "1.7.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
recyclerview = "1.3.2"
viewpager2 = "1.1.0"
swiperefreshlayout = "1.1.0"
constraintlayout = "2.2.0"
coordinatorlayout = "1.2.0"
cardview = "1.0.0"
palette = "1.0.0"
browser = "1.8.0"
webkit = "1.12.1"
customview = "1.1.0"
drawerlayout = "1.2.0"
# Material Design
material = "1.12.0"
# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"
# Image Loading
glide = "4.16.0"
# Room Database
room = "2.6.1"
roomRxjava3 = "2.6.1"
# Dependency Injection
hilt = "2.51.1"
hiltNavigationCompose = "1.2.0"
# Security
securityCrypto = "1.1.0-alpha06"
biometric = "1.1.0"
# WorkManager
work = "2.10.0"
# DataStore
datastore = "1.1.1"
# Paging
paging = "3.3.4"
# WebSocket
okhttpWs = "4.12.0"
# WebRTC (Google official) - placeholder, not yet used
webrtc = "1.0.32006"
# CameraX
camerax = "1.4.1"
# ML Kit (Document Scanning) - placeholder, not yet used
mlkitDocumentScanner = "16.0.0-beta1"
# ExoPlayer
exoplayer = "2.19.1"
# PhotoView (Zoomable Image)
photoview = "2.3.0"
# Lottie Animation
lottie = "6.6.0"
# Shimmer
shimmer = "0.5.0"
# LeakCanary
leakcanary = "2.14"
# Timber (Logging)
timber = "5.0.1"
# EventBus
eventbus = "3.3.1"
# RxJava3
rxjava3 = "3.1.9"
rxandroid3 = "3.0.2"
# Testing
junit = "4.13.2"
junitExt = "1.2.1"
espresso = "3.6.1"
mockito = "5.14.0"
coroutinesTest = "1.9.0"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# Lifecycle
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "lifecycle" }
# Navigation
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
# UI Components
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
androidx-palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-customview = { group = "androidx.customview", name = "customview", version.ref = "customview" }
androidx-drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
# Material Design
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Networking
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
# Image Loading
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
# Room Database
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-rxjava3 = { group = "androidx.room", name = "room-rxjava3", version.ref = "room" }
# Hilt DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
# Security
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# WorkManager
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
# DataStore
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# Paging
paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
# WebRTC
webrtc = { group = "org.webrtc", name = "google-webrtc", version.ref = "webrtc" }
# CameraX
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
# ML Kit
mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
# ExoPlayer
exoplayer-core = { group = "com.google.android.exoplayer", name = "exoplayer-core", version.ref = "exoplayer" }
exoplayer-ui = { group = "com.google.android.exoplayer", name = "exoplayer-ui", version.ref = "exoplayer" }
# PhotoView
photoview = { group = "com.github.chrisbanes", name = "PhotoView", version.ref = "photoview" }
# Lottie
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
# Shimmer
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }
# LeakCanary
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }
# Timber
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
# EventBus
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }
# RxJava3
rxjava3 = { group = "io.reactivex.rxjava3", name = "rxjava", version.ref = "rxjava3" }
rxandroid3 = { group = "io.reactivex.rxjava3", name = "rxandroid", version.ref = "rxandroid3" }
# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version = "2.0.0-1.0.21" }