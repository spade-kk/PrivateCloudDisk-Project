# 插件生态与自动化平台安全门禁
# 需求对应：Sprint 0 安全基线。所有插件、工作流与生命周期变更必须先通过密钥扫描、
# 契约校验、静态分析和各语言测试，才允许进入构建/部署流水线。
name: Plugin Platform Security Gates

on:
  pull_request:
    paths:
      - 'PrivateCloudDisk-plugin-service/**'
      - 'PrivateCloudDisk-automation-service/**'
      - 'PrivateCloudDisk-plugin-runtime-service/**'
      - 'PrivateCloudDisk-cloudflow-runtime/**'
      - 'PrivateCloudDisk-workflow-service/**'
      - 'PrivateCloudDisk-storage-service/**'
      - 'PrivateCloudDisk-platform-service/**'
      - 'PrivateCloudDisk-gateway-service/**'
      - 'PrivateCloudDisk-web/**'
      - 'contracts/**'
      - 'docs/CLOUDFLOW_*.md'
      - 'docs/PLUGIN_AUTOMATION_PLATFORM_DESIGN.md'
      - 'docker-compose.yml'
      - '.github/workflows/plugin-platform-security.yml'
  push:
    branches: [main]
    paths:
      - 'PrivateCloudDisk-plugin-service/**'
      - 'PrivateCloudDisk-automation-service/**'
      - 'PrivateCloudDisk-plugin-runtime-service/**'
      - 'PrivateCloudDisk-cloudflow-runtime/**'
      - 'PrivateCloudDisk-workflow-service/**'
      - 'PrivateCloudDisk-storage-service/**'
      - 'PrivateCloudDisk-platform-service/**'
      - 'PrivateCloudDisk-gateway-service/**'
      - 'PrivateCloudDisk-web/**'
      - 'contracts/**'
      - 'docs/CLOUDFLOW_*.md'
      - 'docs/PLUGIN_AUTOMATION_PLATFORM_DESIGN.md'

permissions:
  contents: read
  security-events: write

jobs:
  secrets-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 扫描仓库密钥
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 校验 JSON 契约
        run: |
          set -euo pipefail
          find contracts -type f -name '*.json' -print0 |
            xargs -0 -n1 jq empty

  java-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - PrivateCloudDisk-platform-service
          - PrivateCloudDisk-gateway-service
          - PrivateCloudDisk-plugin-service
          - PrivateCloudDisk-automation-service
          - PrivateCloudDisk-workflow-service
          - PrivateCloudDisk-scheduler-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - name: 编译并运行测试
        run: gradle -p "${{ matrix.service }}" clean test --no-daemon

  python-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: PrivateCloudDisk-storage-service/requirements.txt
      - name: 安装依赖
        run: pip install -r PrivateCloudDisk-storage-service/requirements.txt
      - name: 编译检查与生命周期契约测试
        working-directory: PrivateCloudDisk-storage-service
        run: |
          python -m compileall -q app core
          pytest -q tests/test_file_preprocess_lifecycle.py tests/test_enhance_dlq_contract.py

  go-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: PrivateCloudDisk-plugin-runtime-service/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行 Runtime 单元测试
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: |
          go test -short -count=1 ./...
          go vet ./...
      - name: 校验沙箱镜像加固策略产物与 deploy/ 一致
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: sh scripts/check_sandbox_profiles.sh
      - name: 运行 Runtime JS AST 校验器规则测试（需求五）
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: node validator/test_validate_js.mjs
      - name: 运行 Runtime Python AST 校验器规则测试（需求四）
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: python3 validator/test_validate_python.py
      - name: 运行 pycloud SDK 能力通道单测（需求六）
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: PYTHONPATH=sandbox/python python3 -m unittest discover -s sandbox/python/tests -p 'test_*.py'
      - name: 运行时受限 Python 层单测（36.26-36.31）
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: PYTHONPATH=sandbox/python python3 -m unittest discover -s sandbox/python/tests -p 'test_restricted.py'
      - name: realworld 插件包与基线一致性（需求三 3.18-3.19/3.30）
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: |
          sh scripts/package_test_plugins.sh
          git diff --exit-code --quiet -- testdata/packages/ || {
            echo "testdata/packages 与 realworld 源码不一致，请重新运行 scripts/package_test_plugins.sh" >&2; exit 1; }
          python3 scripts/gen_baselines.py
          git diff --exit-code --quiet -- testdata/expected/ || {
            echo "testdata/expected 基线与插件逻辑漂移，请重跑 scripts/gen_baselines.py 并提交" >&2; exit 1; }

  plugin-runtime-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: PrivateCloudDisk-plugin-runtime-service/go.mod
      - name: 验证 Docker gVisor/runsc 配置说明（仅文档检查；runsc 需节点 root 安装）
        run: |
          docker version --format '{{.Client.Version}}/{{.Server.Arch}}'
          docker info --format '{{json .Runtimes}}'
      - name: 构建沙箱执行镜像（含 seccomp/AppArmor 产物）
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: docker build -t pcd/plugin-sandbox-python:0.1.2 sandbox/python
      - name: 运行 Docker 集成测试（沙箱隔离/超时/清理/脱敏 + realworld 业务插件/能力网关/基线）
        working-directory: PrivateCloudDisk-plugin-runtime-service
        env:
          PLUGIN_SANDBOX_IMAGE: pcd/plugin-sandbox-python:0.1.2
          PLUGIN_SANDBOX_RUNTIME: runc
        run: go test -short=false -tags=integration -count=1 -timeout 30m ./internal/sandbox/ -run 'TestIntegration|TestRealWorld'
      - name: 运行全模块集成标签编译验证
        working-directory: PrivateCloudDisk-plugin-runtime-service
        run: go build -tags=integration ./...

  cloudflow-rust:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cloudflow_test
          MYSQL_DATABASE: pcd_cloudflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcloudflow_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PrivateCloudDisk-cloudflow-runtime
      - name: CloudFlow 格式、静态分析、测试与双二进制构建
        working-directory: PrivateCloudDisk-cloudflow-runtime
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          # [CLOUDFLOW-COVERAGE-001] 覆盖样例必须逐个经 CLI 编译，并验证生成 IR 的 JSON Schema 契约。
          ./scripts/verify_coverage.sh
          CLOUDFLOW_TEST_DATABASE_URL='mysql://root:cloudflow_test@127.0.0.1:3306/pcd_cloudflow' \
          CLOUDFLOW_TEST_RABBITMQ_URL='amqp://guest:guest@127.0.0.1:5672/%2f' \
            cargo test --locked --test cloudflow_infrastructure_contract \
              mysql_inbox_outbox_recovery_and_rabbit_command_are_integrated -- --ignored --exact
          # [CLOUDFLOW-RUNTIME-CONTROL-001] foreach/try/catch/finally/wait 不能只靠内存单测；
          # 必须在真实 MySQL 检查点上验证暂停、恢复和动态子任务的状态收敛。
          CLOUDFLOW_TEST_DATABASE_URL='mysql://root:cloudflow_test@127.0.0.1:3306/pcd_cloudflow' \
            cargo test --locked --test cloudflow_infrastructure_contract \
              mysql_dynamic_controls_and_wait_resume_are_recoverable -- --ignored --exact
          cargo test --locked --test cloudflow_agent_contract \
            grpc_agent_proxies_to_capability_hub_and_keeps_security_context -- --ignored --exact
          cargo build --release --locked --bins

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: PrivateCloudDisk-web/package-lock.json
      - name: 类型检查与生产构建
        working-directory: PrivateCloudDisk-web
        run: |
          npm ci
          npm run test:cloudflow
          npx vue-tsc --noEmit
          npm run build

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, python, go]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
