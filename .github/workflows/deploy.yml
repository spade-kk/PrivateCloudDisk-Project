# .github/workflows/deploy.yml
# PrivateCloudDisk - CI/CD 自动化部署流水线
#
# 触发条件:
#   - push 到 main 分支
#   - 手动触发 (workflow_dispatch)
#
# 流程:
#   1. 代码检出
#   2. 构建 Docker 镜像
#   3. 推送到容器镜像仓库
#   4. SSH 到服务器执行部署
#   5. 健康检查验证

name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==================== 构建 ====================
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - platform-service
          - gateway-service
          - file-service
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./PrivateCloudDisk-${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署 ====================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/privateclouddisk

            echo "=== 拉取最新代码 ==="
            git pull origin main

            echo "=== 拉取最新镜像 ==="
            docker compose -f docker-compose.yml pull

            echo "=== 滚动更新 ==="
            docker compose -f docker-compose.yml up -d --remove-orphans

            echo "=== 等待健康检查 ==="
            sleep 10

            echo "=== 清理旧镜像 ==="
            docker image prune -f

            echo "=== 部署完成 ==="

      - name: Health Check
        run: |
          # 等待服务启动
          sleep 15

          # 检查 API 网关
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.DOMAIN }}/actuator/health || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Health check passed: HTTP $HTTP_CODE"

      - name: Notify
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Deploy ${{ job.status }}: ${{ github.repository }} @ ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}