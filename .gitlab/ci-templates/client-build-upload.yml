    - web

# ============================================================
# 阶段 3：上传到下载服务器
# ============================================================

# ---- 方式 A：rsync 上传（推荐） ----
upload-rsync:
  stage: upload
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "${DOWNLOAD_SERVER_SSH_KEY}" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "${DOWNLOAD_SERVER_HOST} ecdsa-sha2-nistp256 $(ssh-keyscan -t ecdsa ${DOWNLOAD_SERVER_HOST} 2>/dev/null)" >> ~/.ssh/known_hosts
  script:
    - |
      echo "rsync 上传到 ${DOWNLOAD_SERVER_HOST}:${DOWNLOAD_SERVER_PATH}/binaries/"
      # 收集所有平台的构建产物
      mkdir -p artifacts
      find . -name "CloudDrive-*" -o -name "clouddrive_*" | while read f; do
        cp "$f" artifacts/
      done
      rsync -avz --progress artifacts/ \
        ${DOWNLOAD_SERVER_USER}@${DOWNLOAD_SERVER_HOST}:${DOWNLOAD_SERVER_PATH}/binaries/
  only:
    - tags
    - triggers
    - web
  when: manual
  variables:
    UPLOAD_METHOD: "rsync"

# ============================================================
# 阶段 4：更新版本清单
# ============================================================
update-manifest:
  stage: manifest
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl
  script:
    - |
      echo "更新版本清单到 v${CLIENT_VERSION}"
  only:
    - tags
    - triggers
    - web
  when: manual
  needs:
    - upload-rsync