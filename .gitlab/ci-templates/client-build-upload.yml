# ---- Linux x86_64 ----
build-linux-x64:
  stage: build
  image: electronuserland/builder:latest
  script:
    - echo "构建 Linux x86_64 v${CLIENT_VERSION}"
    # - cd client-desktop
    # - npm ci
    # - npm run build:linux -- --version=${CLIENT_VERSION}
  artifacts:
    paths:
