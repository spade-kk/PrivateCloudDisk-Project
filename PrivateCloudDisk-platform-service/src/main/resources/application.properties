# ============================================================
# 短信发送配置
# 开发环境：enabled=false → 仅打印日志，不实际发送
# 生产环境：配置实际短信服务商API
# ============================================================
app.sms.enabled=false
app.sms.base-url=https://sms-provider.example.com/api
app.sms.api-key=
app.sms.sign-name=私有云
app.sms.expire-seconds=300
app.sms.template.welcome=SMS_WELCOME_TEMPLATE_ID
app.sms.template.verify=SMS_VERIFY_TEMPLATE_ID

# ============================================================
# 验证码安全配置
# ============================================================
# 验证码有效期（秒），默认 300 秒 = 5 分钟
app.verification.code-expire-seconds=300
# 重新发送间隔（秒），默认 60 秒
app.verification.resend-interval-seconds=60
# 重新发送最大次数，默认 8 次
app.verification.max-resends=8
# 重新发送 token 有效期（秒），默认 600 秒 = 10 分钟
app.verification.resend-token-ttl-seconds=600
# 被禁止获取验证码的邮箱域名（逗号分隔，防止用系统邮箱给自己发验证码）
app.verification.blocked-domains=qq.com,163.com,126.com
# 注册接口验证码失败最大次数（同一 IP），默认 5 次
app.verification.register-code-max-failures=5
# 注册接口验证码失败窗口（秒），默认 900 秒 = 15 分钟
app.verification.register-code-failure-window-seconds=900

# ============================================================
# SpringDoc OpenAPI 配置（本地开发环境）
# Swagger UI: http://localhost:8081/swagger-ui.html
# API Docs JSON: http://localhost:8081/v3/api-docs
# ============================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.show-actuator=false
springdoc.writer-with-default-pretty-printer=true

# ============================================================
# gRPC Server 配置
# 端口独立于 HTTP 8081，用于内部微服务间通信
# ============================================================
grpc.server.enabled=true
grpc.server.port=9090
grpc.server.internal-auth-token=${GRPC_INTERNAL_AUTH_TOKEN:}
grpc.server.tls-enabled=false
grpc.server.cert-chain-path=
grpc.server.private-key-path=
grpc.server.reflection-enabled=true
