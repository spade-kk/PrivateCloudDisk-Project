# ============================================================
# SpringDoc OpenAPI 配置（Docker / 生产环境）
# 默认关闭 API 文档以保障安全，通过环境变量按需开启：
#   SPRINGDOC_API_DOCS_ENABLED=true
#   SPRINGDOC_SWAGGER_UI_ENABLED=true
# 如需要临时开启，在 docker-compose.yml 中设置：
#   environment:
#     - SPRINGDOC_API_DOCS_ENABLED=true
#     - SPRINGDOC_SWAGGER_UI_ENABLED=true
# ============================================================
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=false
springdoc.show-actuator=false

# ============================================================
# gRPC Server 配置
# 端口独立于 HTTP 8081，用于内部微服务间通信
# ============================================================
grpc.server.enabled=true
grpc.server.port=9094
grpc.server.internal-auth-token=${GRPC_INTERNAL_AUTH_TOKEN:GzkxtHG3XWltFEy77HCINA}
grpc.server.tls-enabled=false
grpc.server.cert-chain-path=
grpc.server.private-key-path=
grpc.server.reflection-enabled=true

