spring.application.name=PrivateCloudDisk-platform-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/private_cloud_disk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

mybatis.mapper-locations=classpath:mapper/*.xml

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3s

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

security.captcha.turnstile.enabled=${SECURITY_CAPTCHA_TURNSTILE_ENABLED:false}
security.captcha.turnstile.secret-key=${SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY:0x4AAAAAADf7Z-kpJMtKhi_3xlpjOjBm42w}
security.captcha.turnstile.siteverify-url=${SECURITY_CAPTCHA_TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
security.captcha.turnstile.expected-hostname=${SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME:www.hellomyservice.xyz}
security.captcha.turnstile.validate-action=${SECURITY_CAPTCHA_TURNSTILE_VALIDATE_ACTION:true}
security.captcha.turnstile.timeout=${SECURITY_CAPTCHA_TURNSTILE_TIMEOUT:3s}

security.api-rate-limit.enabled=${SECURITY_API_RATE_LIMIT_ENABLED:true}
security.api-rate-limit.login-ip.limit=${SECURITY_RATE_LOGIN_IP_LIMIT:30}
security.api-rate-limit.login-ip.window=${SECURITY_RATE_LOGIN_IP_WINDOW:60s}
security.api-rate-limit.login-identity.limit=${SECURITY_RATE_LOGIN_IDENTITY_LIMIT:10}
security.api-rate-limit.login-identity.window=${SECURITY_RATE_LOGIN_IDENTITY_WINDOW:60s}
security.api-rate-limit.login-failure-ip.limit=${SECURITY_RATE_LOGIN_FAILURE_IP_LIMIT:30}
security.api-rate-limit.login-failure-ip.window=${SECURITY_RATE_LOGIN_FAILURE_IP_WINDOW:15m}
security.api-rate-limit.login-failure-identity.limit=${SECURITY_RATE_LOGIN_FAILURE_IDENTITY_LIMIT:5}
security.api-rate-limit.login-failure-identity.window=${SECURITY_RATE_LOGIN_FAILURE_IDENTITY_WINDOW:15m}
security.api-rate-limit.register-ip.limit=${SECURITY_RATE_REGISTER_IP_LIMIT:10}
security.api-rate-limit.register-ip.window=${SECURITY_RATE_REGISTER_IP_WINDOW:1h}
security.api-rate-limit.register-phone.limit=${SECURITY_RATE_REGISTER_PHONE_LIMIT:3}
security.api-rate-limit.register-phone.window=${SECURITY_RATE_REGISTER_PHONE_WINDOW:1h}
security.api-rate-limit.upload-session-ip.limit=${SECURITY_RATE_UPLOAD_SESSION_IP_LIMIT:60}
security.api-rate-limit.upload-session-ip.window=${SECURITY_RATE_UPLOAD_SESSION_IP_WINDOW:60s}
security.api-rate-limit.upload-session-user.limit=${SECURITY_RATE_UPLOAD_SESSION_USER_LIMIT:20}
security.api-rate-limit.upload-session-user.window=${SECURITY_RATE_UPLOAD_SESSION_USER_WINDOW:60s}
security.api-rate-limit.upload-session-node.limit=${SECURITY_RATE_UPLOAD_SESSION_NODE_LIMIT:8}
security.api-rate-limit.upload-session-node.window=${SECURITY_RATE_UPLOAD_SESSION_NODE_WINDOW:60s}

internal.api.allowed-ips[0]=127.0.0.1
internal.api.allowed-ips[1]=localhost

logging.level.root=INFO
logging.level.org.project=INFO