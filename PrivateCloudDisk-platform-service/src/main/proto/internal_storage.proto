syntax = "proto3";

package org.project.grpc.internal.storage;

option java_multiple_files = true;
option java_package = "org.project.grpc.internal.storage";
option java_outer_classname = "InternalStorageProto";

// =============================================================================
// InternalStorageService — 存储服务内部 RPC 接口
//
// 用于存储服务（PrivateCloudDisk-storage-service）与主业务服务（platform-service）
// 之间的内部通信，替代原有的 HTTP REST API (/business/internal/storage/*)。
//
// 协议设计原则：
//   1. 一对一映射现有 HTTP REST 端点，保持语义一致
//   2. 所有 UUID 字段使用 string 类型（兼容性 + 易调试）
//   3. 时间戳使用 google.protobuf.Timestamp
//   4. 枚举类型映射状态字段，确保类型安全
//   5. 请求/响应消息独立命名，避免复用导致的耦合
// =============================================================================

// ---------- 枚举定义 ----------

// 上传会话状态
enum UploadSessionStatus {
  UPLOAD_SESSION_STATUS_UNSPECIFIED = 0;
  // REQ-UPLOAD-SESSION-STATE-2026-07: 上传会话只保留传输生命周期状态；旧 INIT 编号不再返回。
  reserved 1;
  UPLOAD_SESSION_STATUS_UPLOADING = 2;
  // 原有 merging/failed/deleted 只属于旧状态机，不再作为可返回的状态；保留数值编号避免协议重排。
  reserved 3, 5, 7;
  UPLOAD_SESSION_STATUS_COMPLETED = 4;
  UPLOAD_SESSION_STATUS_CANCELLED = 6;
}

// 分片状态
enum ChunkStatus {
  CHUNK_STATUS_UNSPECIFIED = 0;
  CHUNK_STATUS_PENDING = 1;
  CHUNK_STATUS_UPLOADED = 2;
  CHUNK_STATUS_FAILED = 3;
}

// ---------- 通用消息 ----------

// 空响应（用于仅需状态码的 RPC）
message EmptyResponse {
  int32 code = 1;       // 业务状态码（200 = 成功）
  string message = 2;   // 描述信息
}

// ---------- 分片上传完成 ----------
// 对应: POST /business/internal/storage/uploads/{uploads_id}/chunks/{chunk_index}/complete

message ChunkCompleteRequest {
  string uploads_id = 1;    // 上传会话 UUID
  int32 chunk_index = 2;    // 分片索引（从 0 开始）
  string storage_path = 3;  // 存储服务返回的分片存储路径
}

message ChunkCompleteResponse {
  int32 code = 1;
  string message = 2;
}

// ---------- 查询上传会话 ----------
// 对应: GET /business/internal/storage/uploads/{uploads_id}

message GetUploadSessionRequest {
  string uploads_id = 1;    // 上传会话 UUID
}

message GetUploadSessionResponse {
  int32 code = 1;
  string message = 2;
  UploadSessionInfo data = 3;
}

message UploadSessionInfo {
  string uploads_id = 1;
  string user_id = 2;
  string file_name = 3;
  int64 starting_time = 4;     // epoch millis
  int64 endding_time = 5;      // epoch millis
  int64 file_size = 6;
  int32 chunks_max_size = 7;
  int32 total_chunks = 8;
  string file_checksum = 9;
  string file_type = 10;
  string node_id = 11;
  UploadSessionStatus status = 12;
}

// ---------- 查询分片 ----------
// 对应: GET /business/internal/storage/uploads/{uploads_id}/chunks/{chunk_index}

message GetChunkRequest {
  string uploads_id = 1;
  int32 chunk_index = 2;
}

message GetChunkResponse {
  int32 code = 1;
  string message = 2;
  ChunkInfo data = 3;
}

message ChunkInfo {
  string uploads_id = 1;
  int32 chunk_index = 2;
  ChunkStatus chunk_status = 3;
  string chunk_storage_path = 4;
  int64 chunk_uploaded_time = 5;   // epoch millis
}

// ---------- 合并完成 ----------
// 对应: POST /business/internal/storage/uploads/{uploads_id}/merge

message MergingCompleteRequest {
  string uploads_id = 1;
}

message MergingCompleteResponse {
  int32 code = 1;
  string message = 2;
  string file_id = 3;   // 合并后生成的文件 UUID
}

// ---------- 文件上传完成 ----------
// 对应: POST /business/internal/storage/files

message FileCompleteRequest {
  string uploads_id = 1;
  string file_storage_path = 2;
  string file_id = 3;
  string uid = 4;
}

message FileCompleteResponse {
  int32 code = 1;
  string message = 2;
}

// ---------- 查询文件元数据 ----------
// 对应: GET /business/internal/storage/files/{file_id}

message GetFileMetadataRequest {
  string file_id = 1;
  string uid = 2;
}

message GetFileMetadataResponse {
  int32 code = 1;
  string message = 2;
  FileMetadataInfo data = 3;
}

message FileMetadataInfo {
  string id = 1;
  string name = 2;
  string type = 3;
  int64 size = 4;
  string user_id = 5;
  int64 uploaded_time = 6;   // epoch millis
  string checksum = 7;
  string node_id = 8;
  int32 total_chunks = 9;
  string storage_path = 10;
}

// ---------- 激活文件 ----------
// 对应: POST /business/internal/storage/files/{file_id}/activate

message ActivateFileRequest {
  string file_id = 1;
  string uid = 2;
}

message ActivateFileResponse {
  int32 code = 1;
  string message = 2;
}

// ---------- 更新文件状态 ----------
// 对应: PATCH /business/internal/storage/files/{file_id}/status

message UpdateFileStatusRequest {
  string file_id = 1;
  string status = 2;   // 目标状态值（如 "active", "deleted", "archived"）
  string uid = 3;
}

message UpdateFileStatusResponse {
  int32 code = 1;
  string message = 2;
}

// ---------- 文件删除完成 ----------
// 对应: POST /business/internal/storage/files/{file_id}/delete-complete

message FileDeleteCompleteRequest {
  string file_id = 1;
  string uid = 2;
}

message FileDeleteCompleteResponse {
  int32 code = 1;
  string message = 2;
}

// ---------- 上传会话删除完成 ----------
// 对应: POST /business/internal/storage/uploads/{uploads_id}/delete-complete

message UploadSessionDeleteCompleteRequest {
  string uploads_id = 1;
}

message UploadSessionDeleteCompleteResponse {
  int32 code = 1;
  string message = 2;
}

// =============================================================================
// InternalStorageService — 内部存储 RPC 服务定义
// =============================================================================
service InternalStorageService {

  // 分片上传完成通知
  // 存储服务完成单个分片写入后，通知主业务服务更新分片状态
  rpc ChunkComplete(ChunkCompleteRequest) returns (ChunkCompleteResponse);

  // 查询上传会话
  // 存储服务查询上传会话元数据（含状态、分片信息）
  rpc GetUploadSession(GetUploadSessionRequest) returns (GetUploadSessionResponse);

  // 查询分片信息
  // 存储服务查询指定分片的状态和存储路径
  rpc GetChunk(GetChunkRequest) returns (GetChunkResponse);

  // 合并完成通知
  // 存储服务完成所有分片合并后，通知主业务服务并获取生成的文件 ID
  rpc MergingComplete(MergingCompleteRequest) returns (MergingCompleteResponse);

  // 文件上传完成通知
  // 存储服务完成文件处理（合并+校验）后，通知主业务服务完成上传流程
  rpc FileComplete(FileCompleteRequest) returns (FileCompleteResponse);

  // 查询文件元数据
  // 存储服务查询文件的完整元数据（名称、大小、存储路径等）
  rpc GetFileMetadata(GetFileMetadataRequest) returns (GetFileMetadataResponse);

  // 激活文件
  // 将文件状态从临时（pending）切换为活跃（active）
  rpc ActivateFile(ActivateFileRequest) returns (ActivateFileResponse);

  // 更新文件状态
  // 存储服务更新文件状态（如标记为删除中、归档等）
  rpc UpdateFileStatus(UpdateFileStatusRequest) returns (UpdateFileStatusResponse);

  // 文件删除完成通知
  // 存储服务完成物理文件删除后，通知主业务服务清理元数据
  rpc FileDeleteComplete(FileDeleteCompleteRequest) returns (FileDeleteCompleteResponse);

  // 上传会话删除完成通知
  // 存储服务完成上传会话关联文件清理后，通知主业务服务更新会话状态
  rpc UploadSessionDeleteComplete(UploadSessionDeleteCompleteRequest) returns (UploadSessionDeleteCompleteResponse);
}
