upstream private_cloud_gateway {
    server gateway-service-backend:8080;
    keepalive 32;
}

# HTTP：保留给 Let's Encrypt 续期验证，并把普通请求跳转到 HTTPS
server {
    listen 80;
    server_name www.hellomyservice.xyz;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：正式业务入口
server {
    listen 443 ssl;
    http2 on;
    
    server_name www.hellomyservice.xyz;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 256m;
    client_body_timeout 300s;

    ssl_certificate /etc/letsencrypt/live/www.hellomyservice.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hellomyservice.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/v1/business/internal/ {
        return 404;
    }

    location ^~ /api/v1/files/ {
        proxy_pass http://private_cloud_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-User-Id "";
        proxy_set_header X-Auth-Source "";

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass http://private_cloud_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-User-Id "";
        proxy_set_header X-Auth-Source "";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}