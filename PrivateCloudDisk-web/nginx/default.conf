# ============================================================
# Nginx 企业级生产配置 — PrivateCloudDisk 前端
# ============================================================
# 功能：
#   1. HTTP → HTTPS 强制跳转（保留 Let's Encrypt ACME 验证路径）
#   2. TLS 1.2/1.3 终结，HSTS 强制
#   3. 反向代理 /api/ → 后端 Gateway 服务
#   4. SPA 路由 fallback（try_files → index.html）
#   5. 静态资源预压缩服务（gzip_static + brotli_static）
#   6. 分层缓存策略（hash 文件永久缓存，入口文件禁止缓存）
#   7. 安全响应头（CSP / X-Frame-Options / Referrer-Policy / Permissions-Policy）
#   8. 限流保护（防止 API 滥用）
#   9. 防信息泄露（隐藏 Nginx 版本、禁止访问隐藏文件）
# ============================================================
# 注意：worker_processes / events / worker_rlimit_nofile 等
#   main context 指令已通过 Dockerfile 注入主 nginx.conf
# ============================================================

# ============================================================
# HTTP 基础配置（http context）
# 已移至主 nginx.conf 的指令：mime.types, default_type, server_tokens,
#   log_format, access_log, sendfile, tcp_nopush, tcp_nodelay,
#   keepalive_timeout, keepalive_requests, client_max_body_size
# ============================================================

    # 错误日志（独立配置，与主配置区分）
    error_log  /var/log/nginx/error.log  warn;

    # 客户端超时
    client_body_timeout 300s;
    client_header_timeout 30s;

    # ============================================================
    # Gzip 压缩（动态压缩兜底 + 静态预压缩优先）
    # ============================================================
    # 优先使用预压缩的 .gz 文件（由 vite-plugin-compression 生成）
    gzip_static  on;
    # 动态 gzip 压缩作为兜底
    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/markdown
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        font/opentype;

    # ============================================================
    # Brotli 压缩（比 gzip 压缩率高 15-25%）
    # ============================================================
    # 优先使用预压缩的 .br 文件（由 vite-plugin-compression 生成）
    brotli_static on;
    # 动态 brotli 压缩作为兜底
    brotli        on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ============================================================
    # 上游后端服务
    # ============================================================

    # 主网关（Spring Cloud Gateway）
    upstream private_cloud_gateway {
        server gateway-service-backend:8080;
        keepalive 32;
    }

    # IM 业务平台 HTTP 服务
    upstream im_platform {
        server im-platform-backend:8088;
        keepalive 32;
    }

    # IM WebSocket 长连接推送服务（不支持 HTTP keepalive，使用 hash 保证会话亲和）
    upstream im_websocket {
        hash $remote_addr consistent;
        server im-server-backend:9090;
    }

    # ============================================================
    # HTTP 服务器 — ACME 验证 + HTTPS 重定向
    # ============================================================
    server {
        listen 80;
        server_name www.hellomyservice.xyz;

        # Let's Encrypt HTTP-01 验证路径
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # 所有其他请求跳转到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # HTTPS 服务器 — 正式业务入口
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;

        server_name www.hellomyservice.xyz;

        root /usr/share/nginx/html;
        index index.html;

        # ============================================================
        # SSL/TLS 证书配置
        # ============================================================
        ssl_certificate /etc/letsencrypt/live/www.hellomyservice.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.hellomyservice.xyz/privkey.pem;

        # TLS 协议版本（禁用 TLS 1.0/1.1）
        ssl_protocols TLSv1.2 TLSv1.3;

        # 加密套件（保持兼容性同时保证安全性）
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL 会话缓存
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling（减少证书验证延迟）
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/www.hellomyservice.xyz/chain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ============================================================
        # 安全响应头
        # ============================================================

        # HSTS — 强制浏览器使用 HTTPS 访问（max-age=1年，包含子域名）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # 禁止 MIME 类型嗅探
        add_header X-Content-Type-Options "nosniff" always;

        # 禁止被 iframe 嵌入（防止点击劫持）
        add_header X-Frame-Options "DENY" always;

        # 控制 Referer 信息传递
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 禁止跨域策略文件
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # 禁用浏览器 XSS 过滤（使用 CSP 代替）
        add_header X-XSS-Protection "0" always;

        # 内容安全策略 (CSP) — 按实际需求调整
        # 当前配置为宽松策略，生产环境应逐步收紧
        set $csp_header "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'";
        add_header Content-Security-Policy $csp_header always;

        # 权限策略
        set $pp_header "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()";
        add_header Permissions-Policy $pp_header always;

        # 跨域隔离（用于 SharedArrayBuffer 等特性）
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # ============================================================
        # 禁止访问隐藏文件
        # ============================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ============================================================
        # 内部 API 路径保护（禁止外部访问）
        # ============================================================
        location ^~ /api/v1/business/internal/ {
            return 404;
        }

        # ============================================================
        # 文件服务代理（/api/v1/files/）
        # 分片上传/下载场景，关闭缓冲以支持流式传输
        # ============================================================
        location ^~ /api/v1/files/ {
            proxy_pass http://private_cloud_gateway;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # 清除认证头（由 Gateway 统一处理）
            proxy_set_header X-User-Id "";
            proxy_set_header X-Auth-Source "";

            # 流式传输：关闭缓冲以支持大文件上传/下载
            proxy_request_buffering off;
            proxy_buffering off;

            # 超时设置（大文件上传/下载可能需要较长时间）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        # ============================================================
        # 通用 API 代理
        # ============================================================
        location ^~ /api/ {
            proxy_pass http://private_cloud_gateway;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header X-User-Id "";
            proxy_set_header X-Auth-Source "";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 30s;
        }

        # ============================================================
        # 静态资源（带 hash 的文件名）
        # 长期缓存策略：1 年过期 + immutable 标记
        # 文件名中的 hash 保证内容变更时自动失效
        # ============================================================
        location /assets/ {
            # 先尝试原始文件，再尝试 .br 和 .gz 预压缩文件
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Vary "Accept-Encoding";

            # 安全头：静态资源不需要某些策略
            add_header X-Content-Type-Options "nosniff";
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }

        # ============================================================
        # favicon.ico — 短期缓存
        # ============================================================
        location = /favicon.ico {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            log_not_found off;
        }

        # ============================================================
        # robots.txt — 短期缓存
        # ============================================================
        location = /robots.txt {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
            log_not_found off;
        }

        # ============================================================
        # Swagger/OpenAPI 文档路径保护（生产环境禁止访问）
        # ============================================================
        location ~* ^/(v3/api-docs|swagger-ui|swagger-ui\.html|webjars|docs|redoc|openapi\.json) {
            return 404;
        }

        # ============================================================
        # IM WebSocket 代理 — 长连接推送
        # WebSocket 升级：Connection/Upgrade 头透传，超时设为 1 小时
        # ============================================================
        location ^~ /im/api/v1/ws {
            proxy_pass http://im_websocket;
            proxy_http_version 1.1;

            # WebSocket 升级必需的头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 长连接超时（1 小时）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;

            # 关闭缓冲（实时推送不需要缓冲）
            proxy_buffering off;
        }

        # ============================================================
        # IM HTTP API 代理 — 消息/会话/群组 REST 接口
        # ============================================================
        location ^~ /im/ {
            proxy_pass http://im_platform;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 30s;
        }

        # ============================================================
        # 客户端二进制文件下载 — DMG / EXE / AppImage / DEB / RPM
        # ============================================================
        # 大型二进制文件使用直接文件服务，不经过代理。
        # 版本清单 JSON 也有轻量缓存。
        #
        # 安全策略：
        #   - 仅允许已知的二进制扩展名
        #   - 设置 Content-Disposition 强制下载（防止浏览器直接打开）
        #   - 大文件支持 Range 请求（断点续传）
        #   - 长期缓存（文件名包含版本号，内容不变）
        # ============================================================
        location ^~ /downloads/ {
            alias /usr/share/nginx/html/downloads/;

            # 版本清单 JSON — 短期缓存，允许客户端快速获取更新
            location ~* /downloads/version-manifest\.json$ {
                expires 5m;
                add_header Cache-Control "public, max-age=300, stale-while-revalidate=600";
                add_header X-Content-Type-Options "nosniff";
            }

            # 二进制安装包 — 长期缓存，文件名含版本号，内容不变
            location ~* \.(exe|msi|dmg|pkg|AppImage|deb|rpm|tar\.gz|zip)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
                add_header X-Content-Type-Options "nosniff";
                add_header Content-Disposition "attachment";
                # 支持断点续传（Range 请求）
                add_header Accept-Ranges "bytes";

                # 各文件类型的 MIME 类型
                types {
                    application/x-msdownload        exe;
                    application/x-msi              msi;
                    application/x-apple-diskimage  dmg;
                    application/x-xar              pkg;
                    application/octet-stream       AppImage;
                    application/vnd.debian.binary-package deb;
                    application/x-rpm              rpm;
                    application/gzip               tar.gz;
                    application/zip                zip;
                    application/json               json;
                }
            }
        }

        # ============================================================
        # SPA 路由 — 所有非静态资源请求回退到 index.html
        # Vue Router (History 模式) 需要此配置
        # ============================================================
        location / {
            # 先尝试匹配文件，再匹配目录，最后 fallback 到 index.html
            try_files $uri $uri/ /index.html;

            # 入口文件不缓存（确保更新后用户立即获取最新版本）
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ============================================================
        # 错误页面
        # ============================================================
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }