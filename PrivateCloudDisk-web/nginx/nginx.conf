# ============================================================
# Nginx 主配置文件 — PrivateCloudDisk 企业级多域 CDN 边缘层
# ============================================================
# 架构设计：
#   采用二级域名拆分流量治理，每个子域名对应独立的 Nginx server 块，
#   共享同一套后端微服务集群，通过不同的入口实现差异化策略。
#
#   域名规划：
#     www.hellomyservice.xyz    — 主站 SPA + 静态资源 + 客户端下载
#     api.hellomyservice.xyz    — REST API 网关（速率限制 + 认证）
#     ws.hellomyservice.xyz     — WebSocket 长连接推送（无速率限制）
#     admin.hellomyservice.xyz  — 管理后台（IP 白名单 + 更高安全等级）
#
# 文件结构：
#     nginx.conf                 — 全局配置 + upstream 池 + 共享 map/限流
#     conf.d/00-default.conf      — 兜底拦截（未知 Host / 直接 IP）
#     conf.d/www.conf            — 主站 server 块
#     conf.d/api.conf            — API 网关 server 块
#     conf.d/ws.conf             — WebSocket server 块
#     conf.d/admin.conf          — 管理后台 server 块
#
# 对比单域名路径路由的优势：
#     见 nginx/ARCHITECTURE.md
# ============================================================

# 加载 Brotli 动态模块（必须在 events 块之前）
load_module /etc/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /etc/nginx/modules/ngx_http_brotli_static_module.so;

# 加载 Headers-More 动态模块（用于精确控制/清除响应头）
# 提供 more_set_headers / more_clear_headers 指令，
# 用于清除 Server 头等敏感信息，防止边缘层身份泄露
load_module /etc/nginx/modules/ngx_http_headers_more_filter_module.so;

# ============================================================
# 全局配置（main context）
# ============================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;


# ★ 优雅关闭超时：worker 收到 shutdown 信号后，等待现有连接处理完成的最长时间
#   超过此时间后强制关闭连接。防止 nginx -s reload 时 worker 被 kill 导致客户端 RST
worker_shutdown_timeout 30s;

# 错误日志（不同子域名的错误在各自 server 块中分流）
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# ============================================================
# 事件模型（高并发优化）
# ============================================================
events {
    worker_connections  8192;
    use                 epoll;
    multi_accept        on;
    accept_mutex        off;
}

# ============================================================
# HTTP 模块 — 全局共享配置
# ============================================================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------
    # 日志格式 — JSON（便于 ELK / Loki / 日志平台采集）
    # 每个子域名独立 access_log 文件，便于流量分析和故障定位
    # ----------------------------------------------------------
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"real_ip":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"gzip_ratio":"$gzip_ratio",'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"connection":"$connection",'
        '"connection_requests":"$connection_requests"'
        '}';

    # 访问日志缓冲（减少磁盘 IO，每 5s 或 64KB 刷盘）
    access_log  /var/log/nginx/access.log  json_combined  buffer=64k  flush=5s;

    # ----------------------------------------------------------
    # 文件传输优化
    # ----------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # ─── 客户端连接管理（企业级调优） ───
    # ★ keepalive_timeout：第一个参数是客户端空闲超时（65s），
    #    第二个参数是响应头中 Keep-Alive: timeout= 的值（浏览器可据此优化）
    #    设为 65s 60s（双参数），确保客户端先于 NGINX 关闭连接，避免竞态 RST
    keepalive_timeout 65s 60s;
    
    # ★ keepalive_requests：单条客户端连接最大请求数
    keepalive_requests 400;
    
    # ★ 发送超时：NGINX 向客户端发送响应时的超时（默认 60s）
    #    设为 30s 防止慢客户端长期占用连接资源
    send_timeout 30s;
    
    # ★ 禁止对超时连接发送 RST（默认 on）
    #    关闭后 NGINX 对超时连接使用 FIN 正常关闭，而非 RST 强制重置
    reset_timedout_connection off;
    
    # ★ lingering_close：优雅关闭连接（默认 on）
    #    确保客户端已接收所有数据后才关闭连接，防止数据丢失导致客户端 RST
    lingering_close on;
    lingering_time 5s;
    lingering_timeout 3s;
    
    # ─── HTTP/2 调优（企业级边缘层标准） ───
    # ★ 单条 HTTP/2 连接最大并发流数（默认 128）
    http2_max_concurrent_streams 256;
    
    # ★ HTTP/2 连接空闲超时（默认 180s，3 分钟）
    #    空闲超过此时间后 NGINX 发送 GOAWAY 并关闭连接
    #    设为 120s 确保连接及时回收，避免资源浪费
    http2_idle_timeout 120s;
    
    # ★ HTTP/2 接收超时（默认 30s）
    #    客户端在此时间内未发送数据，NGINX 关闭连接
    http2_recv_timeout 30s;

    # 隐藏 Nginx 版本号（防信息泄露）
    server_tokens  off;

    # 彻底清除 Server 响应头（不暴露 "nginx" 名称和版本）
    # 通过 headers-more-nginx-module 实现，标准 nginx 的 server_tokens off
    # 只能隐藏版本号，无法清除 "Server: nginx" 头本身
    # 参考：B站、阿里云等企业级边缘层均隐藏 Web 服务器身份
    more_clear_headers 'Server';

    # 清除所有代理响应中上游服务器泄露的敏感头
    # 上游服务（Spring Boot / FastAPI 等）可能在响应中设置自己的 Server 头
    # 这些头在反向代理场景下会被透传，必须由边缘层统一清除
    proxy_hide_header 'Server';
    proxy_hide_header 'X-Powered-By';
    proxy_hide_header 'X-AspNet-Version';
    proxy_hide_header 'X-AspNetMvc-Version';

    # 请求体大小限制（全局默认）
    client_max_body_size       50m;
    client_body_buffer_size     256k;
    client_body_timeout         300s;
    client_header_buffer_size    16k;
    client_header_timeout        30s;
    large_client_header_buffers   4 64k;

    # 输出缓冲区
    output_buffers   2 64k;
    postpone_output  1460;

    # ----------------------------------------------------------
    # Gzip 压缩（动态压缩兜底）
    # 静态预压缩 .gz 文件优先（由 vite-plugin-compression 生成）
    # ----------------------------------------------------------
    gzip_static  on;
    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/markdown
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        font/opentype;

    # ----------------------------------------------------------
    # Brotli 压缩（比 gzip 高 15-25% 压缩率）
    # ----------------------------------------------------------
    brotli_static on;
    brotli        on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ----------------------------------------------------------
    # SSL 会话全局缓存（所有子域名共享，减少 TLS 握手开销）
    # ----------------------------------------------------------
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling 全局配置
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ----------------------------------------------------------
    # 全局速率限制区域（各子域名可按需引用）
    # ----------------------------------------------------------

    # API 全局限流（每个 IP 每秒 100 请求，突发 50）
    # limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/s;

    # API 认证接口限流（登录/注册等，每个 IP 每秒 5 请求）
    # limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    # 管理后台限流（更严格，每个 IP 每秒 10 请求）
    # limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=10r/s;

    # 默认兜底 server 限流（严格限制，正常客户端不会通过 IP 直接访问）
    # 每个 IP 每秒最多 10 请求，突发 5，超出返回 444 关闭连接
    # 10m 内存可存储约 16 万个 IP 的限流状态
    limit_req_zone $binary_remote_addr zone=default_zone:10m rate=10r/s;

    # 并发连接数限制（每个 IP 最大 50 并发）
    # limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ----------------------------------------------------------
    # Map 变量（动态路由决策）
    # ----------------------------------------------------------

    # 根据 $host 选择正确的 SSL 证书域名
    # map $host $ssl_cert_domain {
    #     default                   www.hellomyservice.xyz;
    #     "api.hellomyservice.xyz"  api.hellomyservice.xyz;
    #     "ws.hellomyservice.xyz"   ws.hellomyservice.xyz;
    #     "admin.hellomyservice.xyz" admin.hellomyservice.xyz;
    # }
    
    # 统一证书路径（通配符证书）
    ssl_certificate     /etc/letsencrypt/live/hellomyservice.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hellomyservice.xyz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hellomyservice.xyz/fullchain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 客户端真实 IP 提取（CDN / 反向代理后）
    # 信任 Cloudflare CDN IP 段
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header    CF-Connecting-IP;

    # ----------------------------------------------------------
    # Docker 内置 DNS 解析器（127.0.0.11）
    # 用于 proxy_pass 使用变量时的动态域名解析，防止容器重启后 IP 变更导致
    # NGINX 缓存过期 IP 而连接失败。valid=30s 保证 DNS 记录每 30 秒刷新一次。
    # ----------------------------------------------------------
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ----------------------------------------------------------
    # 全局代理默认值（所有 proxy_pass location 继承）
    # 除非在 location 级别显式覆盖，否则以下设置在所有反向代理中生效
    # ----------------------------------------------------------

    # ★ HTTP/1.1 keepalive 到上游：默认启用
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ★ 上游失败重试（解决死连接 RST 透传问题）
    #   error          — 连接错误（含 RST，这正是我们遇到的问题）
    #   timeout        — 上游超时
    #   invalid_header — 上游返回无效响应头
    proxy_next_upstream error timeout invalid_header;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # ★ TCP keepalive 探测上游连接（检测死连接）
    #   60s 空闲后开始探测，10s 间隔，3 次探测失败则判定连接死亡
    proxy_socket_keepalive on;

    # ★ 代理超时默认值
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ★ 代理缓冲默认值
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # ★ 禁止代理缓存（API 响应不应被边缘层缓存）
    proxy_cache off;

    # ----------------------------------------------------------
    # 上游服务池（所有子域名共享同一套后端）
    # ----------------------------------------------------------

    # 主网关（Spring Cloud Gateway）
    # ★★★ 企业级多条目设计：同一后端注册多个 server 条目，每个条目独立的
    #      max_fails 计数器。当一个条目因连续失败被标记为 DOWN 时，其他条目
    #      仍可继续服务，避免单点 max_fails 级联导致整个 upstream 不可用。
    # ★★★ keepalive_requests 80：必须小于 Spring Boot Tomcat 默认的
    #      max-keep-alive-requests=100，确保 NGINX 先于 Tomcat 关闭连接，
    #      避免 Tomcat 关闭连接后 NGINX 仍尝试复用 → TCP RST → Connection reset。
    upstream private_cloud_gateway {
        least_conn;
        # 多条目注册：每个条目独立故障计数，防止 max_fails 级联
        server gateway-service-backend:8080 max_fails=1 fail_timeout=5s;
        server gateway-service-backend:8080 max_fails=1 fail_timeout=5s;
        server gateway-service-backend:8080 max_fails=1 fail_timeout=5s;
        # ★ 上游连接池：64 条 keepalive 连接
        keepalive 64;
        # ★ 每个连接最多处理 80 个请求后由 NGINX 主动关闭
        #   必须 < Tomcat server.tomcat.max-keep-alive-requests (默认 100)
        #   这是间歇性 Connection reset 的核心根因修复：
        #   旧值 1000 → Tomcat 在第 100 个请求时关闭连接 → NGINX 在第 101~1000
        #   个请求时复用已关闭的连接 → TCP RST → 客户端收到 Connection reset
        keepalive_requests 80;
        # ★ 空闲连接超时 50s（必须 < 上游 Spring Boot Tomcat 默认 60s connectionTimeout）
        #   避免竞态：NGINX 先于上游关闭连接，确保不会把请求发到上游已关闭的连接上
        keepalive_timeout 50s;
    }

    # IM WebSocket 长连接推送服务
    # 使用 hash 保证同一客户端始终连接到同一后端实例（会话亲和）
    upstream im_websocket {
        hash $remote_addr consistent;
        # 多条目注册：防止单点 max_fails 级联
        server im-server-backend:9090 max_fails=1 fail_timeout=10s;
        server im-server-backend:9090 max_fails=1 fail_timeout=10s;
        # WebSocket 长连接不需要 keepalive 连接池
        # （WebSocket 连接本身是长连接，不需要池化复用）
    }

    # ----------------------------------------------------------
    # 包含子域名配置文件
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}