# ============================================================
# Nginx 主配置文件 — PrivateCloudDisk 企业级多域 CDN 边缘层
# ============================================================
# 架构设计：
#   采用二级域名拆分流量治理，每个子域名对应独立的 Nginx server 块，
#   共享同一套后端微服务集群，通过不同的入口实现差异化策略。
#
#   域名规划：
#     www.hellomyservice.xyz    — 主站 SPA + 静态资源 + 客户端下载
#     api.hellomyservice.xyz    — REST API 网关（速率限制 + 认证）
#     ws.hellomyservice.xyz     — WebSocket 长连接推送（无速率限制）
#     admin.hellomyservice.xyz  — 管理后台（IP 白名单 + 更高安全等级）
#
# 文件结构：
#     nginx.conf                 — 全局配置 + upstream 池 + 共享 map/限流
#     conf.d/www.conf            — 主站 server 块
#     conf.d/api.conf            — API 网关 server 块
#     conf.d/ws.conf             — WebSocket server 块
#     conf.d/admin.conf          — 管理后台 server 块
#
# 对比单域名路径路由的优势：
#     见 nginx/ARCHITECTURE.md
# ============================================================

# 加载 Brotli 动态模块（必须在 events 块之前）
load_module /etc/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /etc/nginx/modules/ngx_http_brotli_static_module.so;

# ============================================================
# 全局配置（main context）
# ============================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

# 错误日志（不同子域名的错误在各自 server 块中分流）
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# ============================================================
# 事件模型（高并发优化）
# ============================================================
events {
    worker_connections  8192;
    use                 epoll;
    multi_accept        on;
    accept_mutex        off;
}

# ============================================================
# HTTP 模块 — 全局共享配置
# ============================================================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------
    # 日志格式 — JSON（便于 ELK / Loki / 日志平台采集）
    # 每个子域名独立 access_log 文件，便于流量分析和故障定位
    # ----------------------------------------------------------
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"real_ip":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"gzip_ratio":"$gzip_ratio",'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"connection":"$connection",'
        '"connection_requests":"$connection_requests"'
        '}';

    # 访问日志缓冲（减少磁盘 IO，每 5s 或 64KB 刷盘）
    access_log  /var/log/nginx/access.log  json_combined  buffer=64k  flush=5s;

    # ----------------------------------------------------------
    # 文件传输优化
    # ----------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # 长连接
    keepalive_timeout   65;
    keepalive_requests  200;

    # 隐藏 Nginx 版本号（防信息泄露）
    server_tokens  off;

    # 请求体大小限制（全局默认）
    client_max_body_size       100m;
    client_body_buffer_size     256k;
    client_body_timeout         300s;
    client_header_buffer_size    16k;
    client_header_timeout        30s;
    large_client_header_buffers   4 64k;

    # 输出缓冲区
    output_buffers   2 64k;
    postpone_output  1460;

    # ----------------------------------------------------------
    # Gzip 压缩（动态压缩兜底）
    # 静态预压缩 .gz 文件优先（由 vite-plugin-compression 生成）
    # ----------------------------------------------------------
    gzip_static  on;
    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/markdown
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        font/opentype;

    # ----------------------------------------------------------
    # Brotli 压缩（比 gzip 高 15-25% 压缩率）
    # ----------------------------------------------------------
    brotli_static on;
    brotli        on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ----------------------------------------------------------
    # SSL 会话全局缓存（所有子域名共享，减少 TLS 握手开销）
    # ----------------------------------------------------------
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling 全局配置
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ----------------------------------------------------------
    # 全局速率限制区域（各子域名可按需引用）
    # ----------------------------------------------------------

    # API 全局限流（每个 IP 每秒 100 请求，突发 50）
    # limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/s;

    # API 认证接口限流（登录/注册等，每个 IP 每秒 5 请求）
    # limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    # 管理后台限流（更严格，每个 IP 每秒 10 请求）
    # limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=10r/s;

    # 并发连接数限制（每个 IP 最大 50 并发）
    # limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ----------------------------------------------------------
    # Map 变量（动态路由决策）
    # ----------------------------------------------------------

    # 根据 $host 选择正确的 SSL 证书域名
    # map $host $ssl_cert_domain {
    #     default                   www.hellomyservice.xyz;
    #     "api.hellomyservice.xyz"  api.hellomyservice.xyz;
    #     "ws.hellomyservice.xyz"   ws.hellomyservice.xyz;
    #     "admin.hellomyservice.xyz" admin.hellomyservice.xyz;
    # }
    
    # 统一证书路径（通配符证书）
    ssl_certificate     /etc/letsencrypt/live/hellomyservice.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hellomyservice.xyz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hellomyservice.xyz/fullchain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 客户端真实 IP 提取（CDN / 反向代理后）
    # 信任 Cloudflare CDN IP 段
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header    CF-Connecting-IP;

    # ----------------------------------------------------------
    # 上游服务池（所有子域名共享同一套后端）
    # ----------------------------------------------------------

    # 主网关（Spring Cloud Gateway）
    upstream private_cloud_gateway {
        least_conn;
        server gateway-service-backend:8080 max_fails=3 fail_timeout=30s;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # IM WebSocket 长连接推送服务
    # 使用 hash 保证同一客户端始终连接到同一后端实例（会话亲和）
    upstream im_websocket {
        hash $remote_addr consistent;
        server im-server-backend:9090 max_fails=2 fail_timeout=30s;
    }

    # ----------------------------------------------------------
    # 包含子域名配置文件
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}