# ============================================================
# Nginx 主配置文件 — PrivateCloudDisk 企业级生产部署
# ============================================================
# 此文件替换默认的 /etc/nginx/nginx.conf
# 通过 Dockerfile 复制到镜像中
# ============================================================

# 加载 Brotli 动态模块（必须在 events 块之前）
load_module /etc/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /etc/nginx/modules/ngx_http_brotli_static_module.so;

# ============================================================
# 全局配置（main context）
# ============================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# ============================================================
# 事件模型
# ============================================================
events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

# ============================================================
# HTTP 模块
# ============================================================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式 — JSON（便于 ELK / 日志平台采集）
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"gzip_ratio":"$gzip_ratio",'
        '"request_length":$request_length'
        '}';

    # 日志缓冲（减少磁盘 IO）
    access_log  /var/log/nginx/access.log  json_combined  buffer=64k  flush=5s;

    # 文件传输优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # 长连接超时
    keepalive_timeout  65;
    keepalive_requests 100;

    # 隐藏 Nginx 版本号
    server_tokens  off;

    # 客户端请求体大小限制
    client_max_body_size  100m;
    client_body_buffer_size  128k;

    # 客户端请求头缓冲区
    client_header_buffer_size   4k;
    large_client_header_buffers 4 32k;

    # 包含站点配置
    include /etc/nginx/conf.d/*.conf;
}