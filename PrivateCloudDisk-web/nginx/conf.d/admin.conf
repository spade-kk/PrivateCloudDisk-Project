# ============================================================
# admin.hellomyservice.xyz — 管理后台边缘层配置
# ============================================================
# 职责：
#   - 管理后台 SPA 静态资源服务
#   - IP 白名单访问控制（可选，生产环境建议开启）
#   - 更严格的限流策略
#   - 禁止管理后台被搜索引擎索引
#   - 独立的日志和审计轨迹
# ============================================================

# ----------------------------------------------------------
# HTTP (80) — ACME 验证 + HTTPS 强制跳转
# ----------------------------------------------------------
server {
    listen 80;
    server_name admin.hellomyservice.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS (443) — 管理后台入口
# ============================================================
server {
    listen 443 ssl;
    http2 on;

    server_name admin.hellomyservice.xyz;

    root /usr/share/nginx/html/admin;
    index index.html;

    # ----------------------------------------------------------
    # SSL/TLS
    # ----------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/admin.hellomyservice.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.hellomyservice.xyz/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/admin.hellomyservice.xyz/fullchain.pem;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # # 管理后台使用更严格的加密套件
    # ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ssl_prefer_server_ciphers off;

    # ----------------------------------------------------------
    # 日志（独立文件，便于审计和管理流量分析）
    # ----------------------------------------------------------
    access_log /var/log/nginx/admin.access.log json_combined buffer=32k flush=5s;
    error_log  /var/log/nginx/admin.error.log  warn;

    # ----------------------------------------------------------
    # 安全响应头（管理后台使用更严格的安全策略）
    # ----------------------------------------------------------

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 禁止 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # 严格禁止被 iframe 嵌入
    add_header X-Frame-Options "DENY" always;

    # Referer 策略 — 同源才发送
    add_header Referrer-Policy "same-origin" always;

    # 禁止 Flash 跨域
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 禁用 XSS 过滤
    add_header X-XSS-Protection "0" always;

    # 更严格的 CSP（管理后台不允许外部资源）
    set $csp_header "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.hellomyservice.xyz; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp_header always;

    # 权限策略
    set $pp_header "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    add_header Permissions-Policy $pp_header always;

    # 跨域隔离
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ----------------------------------------------------------
    # 禁止搜索引擎索引
    # ----------------------------------------------------------
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # ----------------------------------------------------------
    # IP 白名单（生产环境建议取消注释启用）
    # 仅允许公司内网 / VPN IP 段访问管理后台
    # ----------------------------------------------------------
    # 示例：允许公司 VPN 出口 IP 和办公网络
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # allow 203.0.113.0/24;   # 公司公网出口 IP
    # deny all;
    #
    # 如果启用 IP 白名单，访问日志中会记录被拒绝的 IP
    # 建议配合 fail2ban 自动封禁尝试访问管理后台的异常 IP

    # ----------------------------------------------------------
    # 更严格的限流
    # ----------------------------------------------------------
    limit_req zone=admin_zone burst=5 nodelay;
    limit_req_status 429;
    limit_conn conn_per_ip 10;

    # ----------------------------------------------------------
    # 禁止访问隐藏文件
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # 静态资源 — 长期缓存
    # ----------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        add_header X-Content-Type-Options "nosniff";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # Vite 7 构建产物中 CSS <link> 带有 crossorigin 属性，
        # 浏览器会发起 CORS 请求，需要此头允许 CSS 加载
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ----------------------------------------------------------
    # favicon.ico
    # ----------------------------------------------------------
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # SPA 路由 fallback
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ----------------------------------------------------------
    # 错误页面
    # ----------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/admin;
    }

    # ----------------------------------------------------------
    # 限流超限响应
    # ----------------------------------------------------------
    error_page 429 = @rate_limit;
    location @rate_limit {
        default_type application/json;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后再试","data":null}';
    }
}