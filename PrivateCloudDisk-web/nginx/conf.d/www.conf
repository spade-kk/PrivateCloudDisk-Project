# ============================================================
# www.hellomyservice.xyz — 主站 SPA 边缘层配置
# ============================================================
# 职责：
#   - Vue SPA 静态资源服务（预压缩 + 分层缓存）
#   - 客户端二进制安装包下载（DMG/EXE/AppImage/DEB/RPM）
#   - ACME 验证（Let's Encrypt HTTP-01）
#   - 安全响应头（CSP / HSTS / X-Frame-Options）
#   - SPA 路由 fallback
# ============================================================

# ============================================================
# HTTP (80) — ACME 验证 + HTTPS 强制跳转
# ============================================================
server {
    listen 80;
    server_name www.hellomyservice.xyz;

    # Let's Encrypt HTTP-01 验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 所有其他请求 301 永久重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS (443) — 正式业务入口
# ============================================================
server {
    listen 443 ssl;
    http2 on;

    server_name www.hellomyservice.xyz;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # SSL/TLS
    # ----------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/www.hellomyservice.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.hellomyservice.xyz/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/www.hellomyservice.xyz/chain.pem;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;

    # ----------------------------------------------------------
    # 日志（独立文件，便于分析主站流量）
    # ----------------------------------------------------------
    access_log /var/log/nginx/www.access.log json_combined buffer=64k flush=5s;
    error_log  /var/log/nginx/www.error.log  warn;

    # ----------------------------------------------------------
    # 安全响应头
    # ----------------------------------------------------------

    # HSTS — 强制浏览器使用 HTTPS（max-age=1年，含子域名）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 禁止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # 禁止被 iframe 嵌入（防点击劫持）
    add_header X-Frame-Options "DENY" always;

    # Referer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 禁止 Flash 跨域策略文件
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 禁用浏览器 XSS 过滤（使用 CSP 代替）
    add_header X-XSS-Protection "0" always;

    # 内容安全策略 (CSP)
    set $csp_header "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp_header always;

    # 权限策略
    set $pp_header "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()";
    add_header Permissions-Policy $pp_header always;

    # 跨域隔离
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ----------------------------------------------------------
    # 禁止访问隐藏文件
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # 静态资源 — 带 hash 的文件名（长期缓存）
    # ----------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        add_header X-Content-Type-Options "nosniff";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ----------------------------------------------------------
    # favicon.ico — 短期缓存
    # ----------------------------------------------------------
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # robots.txt — 每日缓存
    # ----------------------------------------------------------
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # 客户端二进制安装包下载
    # ----------------------------------------------------------
    # 版本清单 JSON — 短期缓存
    # 二进制文件 — 长期缓存（文件名含版本号，内容不变）
    # ----------------------------------------------------------
    location ^~ /downloads/ {
        alias /usr/share/nginx/html/downloads/;

        location ~* /downloads/version-manifest\.json$ {
            expires 5m;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=600";
            add_header X-Content-Type-Options "nosniff";
        }

        location ~* \.(exe|msi|dmg|pkg|AppImage|deb|rpm|tar\.gz|zip)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options "nosniff";
            add_header Content-Disposition "attachment";
            add_header Accept-Ranges "bytes";

            types {
                application/x-msdownload               exe;
                application/x-msi                      msi;
                application/x-apple-diskimage          dmg;
                application/x-xar                      pkg;
                application/octet-stream               AppImage;
                application/vnd.debian.binary-package  deb;
                application/x-rpm                      rpm;
                application/gzip                       tar.gz;
                application/zip                        zip;
                application/json                       json;
            }
        }
    }

    # ----------------------------------------------------------
    # SPA 路由 fallback — Vue Router History 模式
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ----------------------------------------------------------
    # 错误页面
    # ----------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}