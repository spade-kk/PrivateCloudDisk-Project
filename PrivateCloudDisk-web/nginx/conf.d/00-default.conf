# ============================================================
# 00-default.conf — 未知主机名 / 直接 IP 访问的兜底拦截
# ============================================================
# 文件名前缀 "00-" 确保此文件在所有子域名配置之前加载，
# 配合显式的 default_server 标记，确保无论文件加载顺序如何，
# 未知 Host 请求始终被此兜底 server 拦截。
#
# 职责：
#   - 拦截所有未匹配到已知子域名的请求
#     （直接 IP 访问、未知域名解析到本 IP、恶意扫描、错误配置的客户端）
#   - 返回 444（NGINX 特有状态码：直接关闭 TCP 连接，不发送任何 HTTP 响应），
#     不泄露任何服务信息（无 HTTP 状态码、无响应体、无 Server 头）
#   - 严格限流（每个 IP 每秒最多 10 请求），防止恶意扫描消耗资源
#   - 独立安全审计日志，便于威胁情报收集和 fail2ban 联动
#
# 与已知子域名的关系：
#   - 已知域名（www/api/ws/admin.hellomyservice.xyz）→ 各自 server 块正常处理
#   - 一切其他 Host（包括裸 IP、其他域名）→ 本兜底 server 拦截
#
# 安全设计理念：
#   - B站/阿里云等企业级系统做法：对于非白名单域名的请求，直接关闭连接
#   - 即使攻击者复制完整请求（头/体/参数/路径），也无法绕过域名白名单
#   - 不返回任何 HTTP 响应，扫描器无法判断服务是否存在
# ============================================================

# ============================================================
# HTTP (80) — 默认兜底，拦截所有未知 Host
# ============================================================
server {
    # ★ default_server 标记：显式声明此 server 为默认服务器
    # 当请求的 Host 头不匹配任何 server_name 时，NGINX 路由到此块
    listen 80 default_server;
    listen [::]:80 default_server;

    # server_name _ 是 NGINX 惯用写法，表示"匹配一切"
    # "_" 只是一个占位符，永远不会匹配任何真实主机名
    server_name _;

    # ─── 严格限流：每个 IP 每秒最多 10 请求 ───
    # 正常客户端不会通过 IP 直接访问 80 端口
    # 高频率访问大概率是端口扫描 / 漏洞探测 / 恶意爬虫
    limit_req zone=default_zone burst=5 nodelay;
    limit_req_status 444;

    # 禁止访问日志（纯扫描流量噪音太大，不记录）
    # 如果需要审计，取消下面注释：
    # access_log /var/log/nginx/default_80.access.log json_combined buffer=32k flush=5s;
    access_log off;

    # ─── 静默关闭连接 ───
    # 444 是 NGINX 特有的非标准状态码，表示：
    #   1. 不发送任何 HTTP 响应行（无状态码、无响应头）
    #   2. 直接关闭 TCP 连接
    #   3. 客户端看到的是 "Connection reset" 或 "Empty response"
    # 对比 403/404：不泄露"此处有 Web 服务器"的信息
    return 444;
}

# ============================================================
# HTTPS (443) — 默认兜底，拦截所有未知 SNI / Host
# ============================================================
server {
    # ★ 显式 default_server，拦截所有未知 SNI 的 TLS 连接
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;

    # ─── SSL 证书（使用全局通配符证书） ───
    # 虽然证书中的域名与 IP / 未知域名不匹配，但 TLS 握手可以完成。
    # 握手完成后 NGINX 立即返回 444 关闭连接。
    # 证书信息已经通过合法的 HTTPS 连接公开，此处不构成额外泄露。
    # 如果需要更强的隐匿性，可将下面两行替换为自签名证书路径。
    # ssl_certificate     /etc/nginx/self-signed-default.crt;
    # ssl_certificate_key /etc/nginx/self-signed-default.key;

    # ─── 严格限流 ───
    limit_req zone=default_zone burst=3 nodelay;
    limit_req_status 444;

    # ─── 安全审计日志（独立文件） ───
    # 记录所有被拦截的 HTTPS 请求，用于：
    #   1. 威胁情报分析（哪些 IP 在扫描、使用什么客户端）
    #   2. fail2ban 自动封禁
    #   3. 发现错误配置的合法客户端（如 DNS 配置错误导致域名解析到本 IP）
    access_log /var/log/nginx/default_443.access.log json_combined buffer=32k flush=5s;
    error_log  /var/log/nginx/default_443.error.log  warn;

    # ─── 安全响应头（最低限度，反正 444 也不发送） ───
    # 如果未来改为返回 403 等，这些头可防止信息泄露
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ─── 静默关闭连接 ───
    return 444;
}