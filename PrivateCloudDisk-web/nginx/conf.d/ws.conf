# ============================================================
# ws.hellomyservice.xyz — WebSocket 长连接边缘层配置
# ============================================================
# 职责：
#   - WebSocket 长连接代理（IM 实时推送）
#   - 无速率限制（长连接不适合限流）
#   - 超高超时（1 小时，适配 WebSocket 心跳周期）
#   - 会话亲和性（hash $remote_addr 保证同一客户端复用同一后端）
#   - 连接数限制（防止单 IP 滥用）
# ============================================================

# ----------------------------------------------------------
# HTTP (80) — ACME 验证 + HTTPS 强制跳转
# ----------------------------------------------------------
server {
    listen 80;
    server_name ws.hellomyservice.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS (443) — WebSocket 长连接入口
# ============================================================
server {
    listen 443 ssl;
    http2 on;

    server_name ws.hellomyservice.xyz;

    # ----------------------------------------------------------
    # SSL/TLS
    # ----------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/ws.hellomyservice.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ws.hellomyservice.xyz/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/ws.hellomyservice.xyz/chain.pem;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ssl_prefer_server_ciphers off;

    # ----------------------------------------------------------
    # 日志（独立文件，便于 WebSocket 连接分析）
    # ----------------------------------------------------------
    access_log /var/log/nginx/ws.access.log json_combined buffer=64k flush=5s;
    error_log  /var/log/nginx/ws.error.log  warn;

    # ----------------------------------------------------------
    # 安全响应头（WebSocket 不需要 CSP / X-Frame-Options）
    # ----------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ----------------------------------------------------------
    # 连接数限制（每个 IP 最多 10 个 WebSocket 连接）
    # ----------------------------------------------------------
    limit_conn conn_per_ip 10;

    # ----------------------------------------------------------
    # WebSocket 代理 — 全部流量转发到 IM WebSocket 服务
    # ----------------------------------------------------------
    # 注意：不设置 limit_req，WebSocket 长连接不适合请求速率限制
    # ----------------------------------------------------------
    location / {
        proxy_pass http://im_websocket;
        proxy_http_version 1.1;

        # WebSocket 协议升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理头
        proxy_set_header Host ws.hellomyservice.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # 长连接超时（1 小时，适配 WebSocket 心跳）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # 关闭缓冲（实时推送不需要缓冲）
        proxy_buffering off;

        # 禁止代理缓存
        proxy_cache off;
    }

    # ----------------------------------------------------------
    # 健康检查
    # ----------------------------------------------------------
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type "text/plain";
    }
}