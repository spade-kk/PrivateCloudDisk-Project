# ============================================================
# api.hellomyservice.xyz — REST API 边缘网关配置
# ============================================================
# 职责：
#   - 统一 API 流量入口（反向代理到 Spring Cloud Gateway）
#   - 多层速率限制（认证接口严格限流，通用接口适度限流）
#   - CORS 跨域策略（允许主站和管理后台域名跨域访问）
#   - 流式传输支持（分片上传/下载关闭缓冲）
#   - 内部 API 路径保护
#   - 请求体大小按接口类型差异化
# ============================================================

# ----------------------------------------------------------
# 变量：提取客户端真实 IP（如有 CDN 已在主配置中处理）
# ----------------------------------------------------------
map $http_x_forwarded_for $client_real_ip {
    ~^([^,]+) $1;
    default   $remote_addr;
}

# ----------------------------------------------------------
# HTTP (80) — ACME 验证 + HTTPS 强制跳转
# ----------------------------------------------------------
server {
    listen 80;
    server_name api.hellomyservice.xyz;

    # ★ 禁止在重定向中暴露原始主机名（防 host header 注入/重定向投毒）
    server_name_in_redirect off;


    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS (443) — API 网关入口
# ============================================================
server {
    listen 443 ssl;
    http2 on;

    server_name api.hellomyservice.xyz;

    # ★ 禁止在重定向中暴露原始主机名（防 host header 注入/重定向投毒）
    server_name_in_redirect off;


    # ----------------------------------------------------------
    # SSL/TLS
    # ----------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/api.hellomyservice.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.hellomyservice.xyz/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/api.hellomyservice.xyz/fullchain.pem;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ssl_prefer_server_ciphers off;

    # ----------------------------------------------------------
    # 日志（独立文件，便于 API 流量分析）
    # ----------------------------------------------------------
    access_log /var/log/nginx/api.access.log json_combined buffer=64k flush=5s;
    error_log  /var/log/nginx/api.error.log  warn;

    # ----------------------------------------------------------
    # 安全响应头（API 不需要 CSP / X-Frame-Options）
    # ----------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;

    # ----------------------------------------------------------
    # CORS — 允许主站和管理后台跨域访问 API
    # ----------------------------------------------------------
    set $cors_origin "";
    if ($http_origin ~* "^https?://(www\.|admin\.)?hellomyservice\.xyz$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin "https://www.hellomyservice.xyz" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Turnstile-Token,X-Download-Grant,X-Device-Fingerprint,X-Request-Signature,X-Signature,X-Timestamp,X-Nonce" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;

    # OPTIONS 预检请求直接返回 204
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ----------------------------------------------------------
    # 全局并发连接限制
    # ----------------------------------------------------------
    # limit_conn conn_per_ip 50;

    # ----------------------------------------------------------
    # 禁止访问内部 API
    # ----------------------------------------------------------
    location ^~ /api/v1/business/internal/ {
        return 404;
    }

    # ----------------------------------------------------------
    # 认证接口 — 严格限流（登录/注册）
    # 每个 IP 每秒 5 请求，突发 3，超出返回 429
    # ----------------------------------------------------------
    location ^~ /api/v1/auth/ {
        # limit_req zone=api_auth burst=3 nodelay;
        # limit_req_status 429;

        proxy_pass http://private_cloud_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host api.hellomyservice.xyz;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-User-Id "";
        proxy_set_header X-Auth-Source "";

        # 认证接口超时（短超时，避免暴力破解占用连接）
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;

        # 限流信息传递到后端（用于日志记录）
        proxy_set_header X-RateLimit-Remaining "0";
    }

    # ----------------------------------------------------------
    # 文件服务 — 流式传输（分片上传/下载）
    # 关闭缓冲，超时设为 1 小时
    # ----------------------------------------------------------
    location ^~ /api/v1/files/ {
        # limit_req zone=api_global burst=50 nodelay;
        # limit_req_status 429;

        proxy_pass http://private_cloud_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host api.hellomyservice.xyz;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-User-Id "";
        proxy_set_header X-Auth-Source "";

        # 流式传输：关闭缓冲（分片上传/下载需要实时传输）
        proxy_request_buffering off;
        proxy_buffering off;

        # 大文件超时设置
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # 请求体大小限制（文件上传场景）
        client_max_body_size 5000m;
    }

    # ----------------------------------------------------------
    # 通用 API — 适度限流
    # ----------------------------------------------------------
    location / {
        # limit_req zone=api_global burst=30 nodelay;
        # limit_req_status 429;

        proxy_pass http://private_cloud_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host api.hellomyservice.xyz;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-User-Id "";
        proxy_set_header X-Auth-Source "";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # ----------------------------------------------------------
    # 健康检查端点（不限流）
    # ----------------------------------------------------------
    location = /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type "text/plain";
    }

    # ----------------------------------------------------------
    # 限流超限响应
    # ----------------------------------------------------------
    error_page 429 = @rate_limit;
    location @rate_limit {
        default_type application/json;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后再试","data":null}';
    }
}