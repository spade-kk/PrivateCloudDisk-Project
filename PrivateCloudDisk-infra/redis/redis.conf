# ========== 网络 ==========
bind 0.0.0.0
port 6379
protected-mode no

# ========== 持久化（RDB + AOF 双写） ==========
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ========== 内存 ==========
maxmemory 256mb
maxmemory-policy allkeys-lru

# ========== 日志 ==========
loglevel notice
logfile ""

# ========== 连接 ==========
timeout 300
tcp-keepalive 60
maxclients 10000