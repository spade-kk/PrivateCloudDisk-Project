global_rules:
  - id: 1
    plugins:
      coraza-filter:
        conf:
          directives_map:
            default:
              - SecRuleEngine On
              - SecDebugLogLevel 3
              - SecRequestBodyAccess On
              - SecResponseBodyAccess Off
              - SecRequestBodyLimit 10485760
              - SecRequestBodyNoFilesLimit 1048576
              - SecAuditEngine RelevantOnly
              - SecAuditLogParts ABIJDEFHZ
              # 关键修改：使用容器内的绝对路径
              - Include /usr/local/apisix/coreruleset/rules/*.conf
              # 可选：如果需要自定义异常分数等，可以在此添加 SecAction
              - SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1,setvar:tx.blocking_paranoia_level=1,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4,setvar:tx.crs_validate_utf8_encoding=1"
          default_directives: default

routes:
  # ========== 业务 API 路由 ==========
  - id: 100
    uri: /api/v1/*
    upstream:
      type: roundrobin
      nodes:
        "gateway-service-backend:8080": 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
        allow_headers: "*"
        max_age: 3600
#END