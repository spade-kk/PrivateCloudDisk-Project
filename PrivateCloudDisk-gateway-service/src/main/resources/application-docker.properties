spring.application.name=PrivateCloudDisk-gateway-service
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=business-service
spring.cloud.gateway.server.webflux.routes[0].uri=${BUSINESS_SERVICE_URL:http://platform-service-backend:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/business/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=Retry
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.retries=3
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE

spring.cloud.gateway.server.webflux.routes[1].id=file-service
spring.cloud.gateway.server.webflux.routes[1].uri=${FILE_SERVICE_URL:http://file-service-backend:8000}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/files/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

jwt.public-key-path=classpath:keys/public_key.pem

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}

gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.fail-open=${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}
gateway.rate-limit.rules[0].name=public-login-ip
gateway.rate-limit.rules[0].path-pattern=/api/v1/business/users/login
gateway.rate-limit.rules[0].method=POST
gateway.rate-limit.rules[0].key-type=IP
gateway.rate-limit.rules[0].limit=${GATEWAY_RATE_LOGIN_IP_LIMIT:30}
gateway.rate-limit.rules[0].window=${GATEWAY_RATE_LOGIN_IP_WINDOW:60s}
gateway.rate-limit.rules[1].name=public-register-ip
gateway.rate-limit.rules[1].path-pattern=/api/v1/business/users/
gateway.rate-limit.rules[1].method=POST
gateway.rate-limit.rules[1].key-type=IP
gateway.rate-limit.rules[1].limit=${GATEWAY_RATE_REGISTER_IP_LIMIT:10}
gateway.rate-limit.rules[1].window=${GATEWAY_RATE_REGISTER_IP_WINDOW:1h}
gateway.rate-limit.rules[2].name=upload-session-user
gateway.rate-limit.rules[2].path-pattern=/api/v1/business/uploads/
gateway.rate-limit.rules[2].method=POST
gateway.rate-limit.rules[2].key-type=USER
gateway.rate-limit.rules[2].limit=${GATEWAY_RATE_UPLOAD_SESSION_USER_LIMIT:20}
gateway.rate-limit.rules[2].window=${GATEWAY_RATE_UPLOAD_SESSION_USER_WINDOW:60s}
gateway.rate-limit.rules[3].name=operation-token-issue-user
gateway.rate-limit.rules[3].path-pattern=/api/v1/files/operation-tokens
gateway.rate-limit.rules[3].method=POST
gateway.rate-limit.rules[3].key-type=USER
gateway.rate-limit.rules[3].limit=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_USER_LIMIT:30}
gateway.rate-limit.rules[3].window=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_USER_WINDOW:60s}
gateway.rate-limit.rules[4].name=operation-token-issue-ip
gateway.rate-limit.rules[4].path-pattern=/api/v1/files/operation-tokens
gateway.rate-limit.rules[4].method=POST
gateway.rate-limit.rules[4].key-type=IP
gateway.rate-limit.rules[4].limit=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_IP_LIMIT:120}
gateway.rate-limit.rules[4].window=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_IP_WINDOW:60s}
gateway.rate-limit.rules[5].name=operation-token-destroy-user
gateway.rate-limit.rules[5].path-pattern=/api/v1/files/operation-tokens
gateway.rate-limit.rules[5].method=DELETE
gateway.rate-limit.rules[5].key-type=USER
gateway.rate-limit.rules[5].limit=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_USER_LIMIT:60}
gateway.rate-limit.rules[5].window=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_USER_WINDOW:60s}
gateway.rate-limit.rules[6].name=operation-token-destroy-ip
gateway.rate-limit.rules[6].path-pattern=/api/v1/files/operation-tokens
gateway.rate-limit.rules[6].method=DELETE
gateway.rate-limit.rules[6].key-type=IP
gateway.rate-limit.rules[6].limit=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_IP_LIMIT:180}
gateway.rate-limit.rules[6].window=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_IP_WINDOW:60s}

# ============================================
# 设备指纹限流规则（Web 前端 + fingerprintjs）
# ============================================
gateway.rate-limit.rules[7].name=public-login-fp
gateway.rate-limit.rules[7].path-pattern=/api/v1/business/users/login
gateway.rate-limit.rules[7].method=POST
gateway.rate-limit.rules[7].key-type=FINGERPRINT_OR_IP
gateway.rate-limit.rules[7].limit=${GATEWAY_RATE_LOGIN_FP_LIMIT:20}
gateway.rate-limit.rules[7].window=${GATEWAY_RATE_LOGIN_FP_WINDOW:60s}
gateway.rate-limit.rules[8].name=public-register-fp
gateway.rate-limit.rules[8].path-pattern=/api/v1/business/users/
gateway.rate-limit.rules[8].method=POST
gateway.rate-limit.rules[8].key-type=FINGERPRINT_OR_IP
gateway.rate-limit.rules[8].limit=${GATEWAY_RATE_REGISTER_FP_LIMIT:5}
gateway.rate-limit.rules[8].window=${GATEWAY_RATE_REGISTER_FP_WINDOW:1h}

# ============================================
# 设备身份验证配置（企业级多因子设备识别）
# ============================================
gateway.device-identity.enabled=${GATEWAY_DEVICE_IDENTITY_ENABLED:true}
gateway.device-identity.allow-untrusted-for-public=${GATEWAY_DEVICE_ALLOW_UNTRUSTED_PUBLIC:true}
gateway.device-identity.internal-cidrs[0]=10.0.0.0/8
gateway.device-identity.internal-cidrs[1]=172.16.0.0/12
gateway.device-identity.internal-cidrs[2]=192.168.0.0/16
gateway.device-identity.internal-cidrs[3]=127.0.0.0/8

# ============================================
# 增强版信任评分阈值
# ============================================
gateway.device-identity.high-trust-threshold=80
gateway.device-identity.medium-trust-threshold=60
gateway.device-identity.low-trust-threshold=30

# ============================================
# Web 浏览器验证
# ============================================
gateway.device-identity.web.enabled=true
gateway.device-identity.web.minimum-trust-level=MEDIUM
gateway.device-identity.web.fingerprint-min-length=16
gateway.device-identity.web.fingerprint-max-length=128
gateway.device-identity.web.max-timestamp-skew=5m
gateway.device-identity.web.nonce-cache-ttl=10m
gateway.device-identity.web.require-user-agent=true
gateway.device-identity.web.require-accept=true
gateway.device-identity.web.require-accept-language=true
gateway.device-identity.web.require-sec-fetch=true
gateway.device-identity.web.require-fingerprint=true
gateway.device-identity.web.validate-ua-consistency=true
gateway.device-identity.web.validate-accept-language=true
gateway.device-identity.web.bot-ua-keywords[0]=headless
gateway.device-identity.web.bot-ua-keywords[1]=phantom
gateway.device-identity.web.bot-ua-keywords[2]=selenium
gateway.device-identity.web.bot-ua-keywords[3]=puppeteer
gateway.device-identity.web.bot-ua-keywords[4]=playwright
gateway.device-identity.web.bot-ua-keywords[5]=scrapy
gateway.device-identity.web.bot-ua-keywords[6]=curl/
gateway.device-identity.web.bot-ua-keywords[7]=wget/
gateway.device-identity.web.bot-ua-keywords[8]=python-requests
gateway.device-identity.web.bot-ua-keywords[9]=go-http-client
gateway.device-identity.web.bot-ua-keywords[10]=axios/
gateway.device-identity.web.bot-ua-keywords[11]=node-fetch
gateway.device-identity.web.bot-ua-keywords[12]=okhttp/
gateway.device-identity.web.bot-ua-keywords[13]=insomnia
gateway.device-identity.web.bot-ua-keywords[14]=postman

# ============================================
# Native App 验证
# ============================================
gateway.device-identity.native-app.enabled=true
gateway.device-identity.native-app.minimum-trust-level=MEDIUM
gateway.device-identity.native-app.max-timestamp-skew=5m
gateway.device-identity.native-app.nonce-cache-ttl=10m
gateway.device-identity.native-app.signing-secret=${DEVICE_SIGNING_SECRET:change-me-in-production}
gateway.device-identity.native-app.minimum-client-version=1.0.0
gateway.device-identity.native-app.enforce-version=false

# ============================================
# 挑战-应答配置（防浏览器指纹伪造）
# ============================================
gateway.device-identity.challenge.enabled=true
gateway.device-identity.challenge.challenge-ttl=60s
gateway.device-identity.challenge.nonce-ttl=120s
gateway.device-identity.challenge.pow-difficulty=${DEVICE_CHALLENGE_POW_DIFFICULTY:4}
gateway.device-identity.challenge.max-score=25

# ============================================
# 平台硬件证明配置（Native App 防逆向）
# ============================================
gateway.device-identity.attestation.enabled=true
gateway.device-identity.attestation.nonce-ttl=5m
gateway.device-identity.attestation.max-score=30

# ============================================
# TLS 指纹配置（JA4 算法）
# ============================================
gateway.device-identity.tls-fingerprint.enabled=true
gateway.device-identity.tls-fingerprint.max-score=20
gateway.device-identity.tls-fingerprint.require-known-browser=false

# ============================================
# 行为分析配置
# ============================================
gateway.device-identity.behavioral.enabled=true
gateway.device-identity.behavioral.max-score=10
gateway.device-identity.behavioral.max-requests-per-minute=${DEVICE_BEHAVIORAL_MAX_REQ_PER_MIN:120}
gateway.device-identity.behavioral.max-ip-changes-per-5-min=3
gateway.device-identity.behavioral.min-request-interval-ms=50

# ============================================
# 设备声誉配置
# ============================================
gateway.device-identity.reputation.enabled=true
gateway.device-identity.reputation.max-score=5
gateway.device-identity.reputation.auto-block-threshold=${DEVICE_REPUTATION_AUTO_BLOCK:10}
gateway.device-identity.reputation.reputation-ttl=90d

# ============================================
# 设备级限流
# ============================================
gateway.device-identity.rate-limit.untrusted-global-per-minute=60
gateway.device-identity.rate-limit.untrusted-login-per-minute=10
gateway.device-identity.rate-limit.untrusted-register-per-hour=3
gateway.device-identity.rate-limit.per-fingerprint-global-per-minute=120

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.project=INFO
