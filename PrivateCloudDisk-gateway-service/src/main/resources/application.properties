spring.application.name=PrivateCloudDisk-gateway-service
# ============================================
# 服务器端口
# ============================================
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# ============================================
# Spring Cloud Gateway 路由配置
# ============================================
# --- 业务服务路由 ---
spring.cloud.gateway.server.webflux.routes[0].id=business-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/business/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=Retry
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.retries=3
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE

# --- 文件服务路由 ---
spring.cloud.gateway.server.webflux.routes[1].id=file-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8000
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/files/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

# --- IM 通信服务路由 ---
spring.cloud.gateway.server.webflux.routes[2].id=im-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8088
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/im/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2

# --- IM WebSocket 服务路由 ---
# WebSocket 路径独立于 /api/v1，网关直接识别 /ws 前缀路由到 im-server
# 不剥离 /ws 前缀，下游 im-server 收到完整路径 /ws?token=xxx
spring.cloud.gateway.server.webflux.routes[3].id=im-websocket
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:9090
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ws/**

# --- 客户端注册服务路由 ---
spring.cloud.gateway.server.webflux.routes[4].id=client-registration-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8089
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/client/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=2

# --- 插件服务公开 API；内部包下载与入口匹配只允许服务私网直连 ---
spring.cloud.gateway.server.webflux.routes[5].id=plugin-service
spring.cloud.gateway.server.webflux.routes[5].uri=${PLUGIN_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/plugins/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=2

# --- 工作流与能力中心公开 API；Scheduler 控制面始终只允许私网直连 ---
spring.cloud.gateway.server.webflux.routes[6].id=workflow-service
spring.cloud.gateway.server.webflux.routes[6].uri=${WORKFLOW_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/workflows/**,/api/v1/capabilities/**,/api/v1/marketplace/workflows/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=2

# ============================================
# JWT 配置
# ============================================
jwt.public-key-path=classpath:keys/public_key.pem

# ============================================
# Redis 配置
# ============================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.timeout=5s
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4

# ============================================
# 网关限流规则（IP + 设备指纹 + 用户 多维度）
# ============================================
gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
gateway.rate-limit.fail-open=${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}

# ============================================
# Sentinel 系统级流量控制 + 熔断降级
# ════════════════════════════════════════════
# 与 gateway.rate-limit（业务策略限流）互补：
#   - Sentinel 负责系统保护（QPS 上限、熔断、系统负载）
#   - gateway.rate-limit 负责业务策略（登录/注册/上传频次）
# ============================================
spring.cloud.sentinel.enabled=true
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.transport.port=${SENTINEL_TRANSPORT_PORT:8719}
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD_HOST:localhost:8080}
spring.cloud.sentinel.filter.enabled=true
spring.cloud.sentinel.filter.order=-2147483648

# Sentinel 规则来源：Nacos 动态规则（生产环境）/ 硬编码默认规则（开发环境）
sentinel.rules.nacos.enabled=${SENTINEL_RULES_NACOS_ENABLED:false}

# Sentinel 网关 API 分组（用于路由级限流）
spring.cloud.sentinel.scg.fallback.response-status=429
spring.cloud.sentinel.scg.fallback.response-body={"code":42900,"message":"系统限流保护已触发"}
# ============================================
# 网关限流规则
# ============================================
gateway.rate-limit.rules[0].name=public-login-ip
gateway.rate-limit.rules[0].path-pattern=/api/v1/business/users/login
gateway.rate-limit.rules[0].method=POST
gateway.rate-limit.rules[0].key-type=IP
gateway.rate-limit.rules[0].limit=${GATEWAY_RATE_LOGIN_IP_LIMIT:40}
gateway.rate-limit.rules[0].window=${GATEWAY_RATE_LOGIN_IP_WINDOW:60s}
gateway.rate-limit.rules[1].name=public-register-ip
gateway.rate-limit.rules[1].path-pattern=/api/v1/business/users/
gateway.rate-limit.rules[1].method=POST
gateway.rate-limit.rules[1].key-type=IP
gateway.rate-limit.rules[1].limit=${GATEWAY_RATE_REGISTER_IP_LIMIT:50}
gateway.rate-limit.rules[1].window=${GATEWAY_RATE_REGISTER_IP_WINDOW:1h}
gateway.rate-limit.rules[2].name=upload-session-user
gateway.rate-limit.rules[2].path-pattern=/api/v1/business/uploads/
gateway.rate-limit.rules[2].method=POST
gateway.rate-limit.rules[2].key-type=USER
gateway.rate-limit.rules[2].limit=${GATEWAY_RATE_UPLOAD_SESSION_USER_LIMIT:30}
gateway.rate-limit.rules[2].window=${GATEWAY_RATE_UPLOAD_SESSION_USER_WINDOW:60s}
gateway.rate-limit.rules[3].name=operation-token-issue-user
gateway.rate-limit.rules[3].path-pattern=/api/v1/files/operation-tokens
gateway.rate-limit.rules[3].method=POST
gateway.rate-limit.rules[3].key-type=USER
gateway.rate-limit.rules[3].limit=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_USER_LIMIT:40}
gateway.rate-limit.rules[3].window=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_USER_WINDOW:60s}
gateway.rate-limit.rules[4].name=operation-token-issue-ip
gateway.rate-limit.rules[4].path-pattern=/api/v1/files/operation-tokens

gateway.rate-limit.rules[4].method=POST
gateway.rate-limit.rules[4].key-type=IP
gateway.rate-limit.rules[4].limit=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_IP_LIMIT:160}
gateway.rate-limit.rules[4].window=${GATEWAY_RATE_OPERATION_TOKEN_ISSUE_IP_WINDOW:60s}
gateway.rate-limit.rules[5].name=operation-token-destroy-user
gateway.rate-limit.rules[5].path-pattern=/api/v1/files/operation-tokens

gateway.rate-limit.rules[5].method=DELETE
gateway.rate-limit.rules[5].key-type=USER
gateway.rate-limit.rules[5].limit=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_USER_LIMIT:60}
gateway.rate-limit.rules[5].window=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_USER_WINDOW:60s}
gateway.rate-limit.rules[6].name=operation-token-destroy-ip
gateway.rate-limit.rules[6].path-pattern=/api/v1/files/operation-tokens

gateway.rate-limit.rules[6].method=DELETE
gateway.rate-limit.rules[6].key-type=IP
gateway.rate-limit.rules[6].limit=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_IP_LIMIT:180}
gateway.rate-limit.rules[6].window=${GATEWAY_RATE_OPERATION_TOKEN_DESTROY_IP_WINDOW:60s}

# ============================================
# 设备指纹限流规则（Web 前端 + fingerprintjs）
# 登录：每个设备指纹每分钟最多 20 次
# 注册：每个设备指纹每小时最多 50 次 (包含成功失败请求都要放行只做网关层基础洪流限流)
# ============================================
gateway.rate-limit.rules[7].name=public-login-fp
gateway.rate-limit.rules[7].path-pattern=/api/v1/business/users/login
gateway.rate-limit.rules[7].method=POST
gateway.rate-limit.rules[7].key-type=FINGERPRINT_OR_IP
gateway.rate-limit.rules[7].limit=${GATEWAY_RATE_LOGIN_FP_LIMIT:20}
gateway.rate-limit.rules[7].window=${GATEWAY_RATE_LOGIN_FP_WINDOW:60s}
gateway.rate-limit.rules[8].name=public-register-fp
gateway.rate-limit.rules[8].path-pattern=/api/v1/business/users/
gateway.rate-limit.rules[8].method=POST
gateway.rate-limit.rules[8].key-type=FINGERPRINT_OR_IP
gateway.rate-limit.rules[8].limit=${GATEWAY_RATE_REGISTER_FP_LIMIT:50}
gateway.rate-limit.rules[8].window=${GATEWAY_RATE_REGISTER_FP_WINDOW:1h}

# ============================================
# 设备级限流（基于已验证设备指纹）
# ============================================
gateway.device-identity.rate-limit.untrusted-global-per-minute=60
gateway.device-identity.rate-limit.untrusted-login-per-minute=10
gateway.device-identity.rate-limit.untrusted-register-per-hour=3
gateway.device-identity.rate-limit.per-fingerprint-global-per-minute=120

# ============================================
# 日志
# ============================================
logging.level.org.project.privateclouddiskgatewayservice=DEBUG
logging.level.org.springframework.cloud.gateway=INFO

# ============================================
# 管理员 API 安全配置
# ============================================
gateway.admin.enabled=${GATEWAY_ADMIN_ENABLED:true}
gateway.admin.path-prefix=/api/v1/business/admin/
gateway.admin.login-path=/api/v1/business/admin/auth/login
gateway.admin.allowed-ips=${GATEWAY_ADMIN_ALLOWED_IPS:127.0.0.1}
gateway.admin.admin-key=${GATEWAY_ADMIN_KEY:changeme-admin-key}

# ============================================
# 管理员 API 限流规则
# ============================================
gateway.rate-limit.rules[9].name=admin-login-ip
gateway.rate-limit.rules[9].path-pattern=/api/v1/business/admin/auth/login
gateway.rate-limit.rules[9].method=POST
gateway.rate-limit.rules[9].key-type=IP
gateway.rate-limit.rules[9].limit=${GATEWAY_RATE_ADMIN_LOGIN_IP_LIMIT:5}
gateway.rate-limit.rules[9].window=${GATEWAY_RATE_ADMIN_LOGIN_IP_WINDOW:60s}
gateway.rate-limit.rules[10].name=admin-api-ip
gateway.rate-limit.rules[10].path-pattern=/api/v1/business/admin/**
gateway.rate-limit.rules[10].method=*
gateway.rate-limit.rules[10].key-type=IP
gateway.rate-limit.rules[10].limit=${GATEWAY_RATE_ADMIN_API_IP_LIMIT:300}
gateway.rate-limit.rules[10].window=${GATEWAY_RATE_ADMIN_API_IP_WINDOW:60s}
