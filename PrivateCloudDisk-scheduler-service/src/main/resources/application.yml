server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: PrivateCloudDisk-scheduler-service
  datasource:
    url: ${SCHEDULER_DATASOURCE_URL:jdbc:mysql://localhost:3306/pcd_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SCHEDULER_DATASOURCE_USERNAME:root}
    password: ${SCHEDULER_DATASOURCE_PASSWORD:20070315mwz}
  flyway:
    enabled: true
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

pcd:
  internal-service-token: ${PCD_INTERNAL_SERVICE_TOKEN:test}
  scheduler:
    node-id: ${SCHEDULER_NODE_ID:${HOSTNAME:local-scheduler}}
    scan-delay-ms: ${SCHEDULER_SCAN_DELAY_MS:1000}
    lease-seconds: ${SCHEDULER_LEASE_SECONDS:30}
    catch-up-limit: ${SCHEDULER_CATCH_UP_LIMIT:5}
