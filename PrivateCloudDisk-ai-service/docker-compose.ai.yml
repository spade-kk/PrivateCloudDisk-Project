# ============================================================
# PrivateCloudDisk AI Service - Docker Compose (开发/测试)
# 使用方式:
#   docker compose -f docker-compose.ai.yml up -d
# ============================================================

services:
  # ---- AI HTTP API 服务 ----
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: privateclouddisk/ai-service:latest
    container_name: pcd-ai-service
    ports:
      - "8001:8001"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - REDIS_URL=redis://redis:6379/1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-20070315mwz}
      - MYSQL_DATABASE=private_cloud_disk
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=private-cloud-disk
      - OPENSEARCH_HOST=https://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-MySecureP@ssw0rd}
      - OPENSEARCH_USE_SSL=true
      - OPENSEARCH_VERIFY_CERTS=false
      - AI_INFERENCE_DEVICE=cpu
      - MODEL_DIR=/app/models
      - MODEL_CACHE_DIR=/app/models/.cache
    volumes:
      - ./models:/app/models
      # 如果需要直接读取本地文件（与 storage-service 共享存储）
      - ../Uploads:/data/uploads:ro
    networks:
      - pcd-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---- AI Worker 进程 (独立消费 RabbitMQ) ----
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: privateclouddisk/ai-service:latest
    container_name: pcd-ai-worker
    command: ["python", "app/worker.py"]
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8001
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - REDIS_URL=redis://redis:6379/1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-20070315mwz}
      - MYSQL_DATABASE=private_cloud_disk
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=private-cloud-disk
      - OPENSEARCH_HOST=https://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-MySecureP@ssw0rd}
      - OPENSEARCH_USE_SSL=true
      - OPENSEARCH_VERIFY_CERTS=false
      - AI_INFERENCE_DEVICE=cpu
      - MODEL_DIR=/app/models
      - MODEL_CACHE_DIR=/app/models/.cache
      - WORKER_PREFETCH_AI=4
      - WORKER_CONCURRENCY_AI=8
      - WORKER_LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
      - ../Uploads:/data/uploads:ro
    networks:
      - pcd-network
    restart: unless-stopped
    deploy:
      replicas: 2  # 可水平扩展

  # ---- GPU 版本 (可选，需要 NVIDIA Container Toolkit) ----
