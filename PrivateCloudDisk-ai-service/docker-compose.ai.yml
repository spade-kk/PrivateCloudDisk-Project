  #   networks:
  #     - pcd-network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   restart: unless-stopped

networks:
  pcd-network:
    external: true
    name: privateclouddisk_pcd-network