# ============================================================
# IM Server — Netty WebSocket + gRPC 推送服务配置 v2.0
# ============================================================
# 重构要点：
#   1. 移除 V1 JSON 协议端口配置（netty.websocket.port-v2）
#   2. 新增 gRPC 服务端口配置（im.server.grpc-port）
#   3. 新增节点 ID 配置（用于分布式 Session 管理）
# ============================================================

server:
  port: ${IM_SERVER_HTTP_PORT:8089}

spring:
  application:
    name: im-server

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
      timeout: 5000ms

  # ==================== RabbitMQ 配置 ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        concurrency: 4
        max-concurrency: 8
        prefetch: 10
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

  # ==================== Jackson 配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ==================== IM Server 节点配置 ====================
im:
  server:
    # 节点 ID（多节点部署时必须唯一，用于 Redis 注册和 gRPC 路由）
    node-id: ${IM_SERVER_NODE_ID:im-server-1}
    # gRPC 服务端口（供 IM Router 调用）
    grpc-port: ${IM_SERVER_GRPC_PORT:9092}
    # gRPC 最大入站消息大小（默认 4MB）
    grpc-max-inbound-size: 4194304

# ==================== Netty 配置 ====================
netty:
  # WebSocket 监听端口（仅 V2 二进制协议）
  websocket:
    port: ${NETTY_WS_PORT:9090}
  # Boss 线程数（接收连接）
  boss:
    threads: 1
  # Worker 线程数（处理 I/O，建议 = CPU 核心数 * 2）
  worker:
    threads: ${NETTY_WORKER_THREADS:8}
  # 业务线程数
  business:
    threads: ${NETTY_BUSINESS_THREADS:16}
  # 连接超时（秒）
  connect-timeout: 30
  # WebSocket 路径（统一 /ws，不再区分 V1/V2）
  websocket-path: /ws

# ==================== 日志配置 ====================
logging:
  level:
    org.project.im.server: DEBUG
    io.netty: WARN

# ==================== WebRTC 配置 ====================
webrtc:
  ice:
    stun-servers:
      - stun:stun.l.google.com:19302
      - stun:stun1.l.google.com:19302
    turn-servers:
      - urls:
          - turn:${TURN_SERVER_HOST:turn.example.com}:3478?transport=udp
          - turn:${TURN_SERVER_HOST:turn.example.com}:3478?transport=tcp
        username: ${TURN_USERNAME:privateclouddisk}
        credential: ${TURN_CREDENTIAL:change_me_in_production}
    transport-policy: all
    candidate-pool-size: 2
  call-invite-timeout: 60
  idle-call-cleanup: 30
  adaptive-encoder:
    switch-cooldown-ms: 3000
    history-size: 10
    quality-report-interval: 2000
