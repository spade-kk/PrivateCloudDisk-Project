# ============================================================
# IM Server — Netty WebSocket 推送服务配置
# ============================================================
server:
  port: ${IM_SERVER_HTTP_PORT:8089}

spring:
  application:
    name: im-server

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
      timeout: 5000ms

  # ==================== RabbitMQ 配置 ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        concurrency: 4
        max-concurrency: 8
        prefetch: 10
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

  # ==================== Jackson 配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ==================== Netty 配置 ====================
netty:
  # WebSocket 监听端口
  websocket:
    port: ${NETTY_WS_PORT:9090}
  # Boss 线程数（接收连接）
  boss:
    threads: 1
  # Worker 线程数（处理 I/O）
  worker:
    threads: ${NETTY_WORKER_THREADS:8}
  # 业务线程数
  business:
    threads: ${NETTY_BUSINESS_THREADS:16}
  # 连接超时（秒）
  connect-timeout: 30
  # WebSocket 路径
  websocket-path: /ws

# ==================== 日志配置 ====================
logging:
  level:
    org.project.im.server: DEBUG
    io.netty: WARN

# ==================== WebRTC 配置 ====================
webrtc:
  # STUN/TURN ICE 服务器配置
  ice:
    # STUN 服务器列表（用于 P2P NAT 穿透）
    stun-servers:
      - stun:stun.l.google.com:19302
      - stun:stun1.l.google.com:19302
    # TURN 服务器列表（用于中继转发，确保 100% 连通性）
    turn-servers:
      - urls:
          - turn:${TURN_SERVER_HOST:turn.example.com}:3478?transport=udp
          - turn:${TURN_SERVER_HOST:turn.example.com}:3478?transport=tcp
        username: ${TURN_USERNAME:privateclouddisk}
        credential: ${TURN_CREDENTIAL:change_me_in_production}
    # ICE 传输策略：all（优先 P2P）| relay（仅中继）
    transport-policy: all
    # ICE Candidate 池大小
    candidate-pool-size: 2
  # 通话邀请超时（秒）
  call-invite-timeout: 60
  # 空闲通话清理（分钟）
  idle-call-cleanup: 30
  # 自适应编码参数
  adaptive-encoder:
    # 参数切换冷却时间（毫秒）
    switch-cooldown-ms: 3000
    # 历史质量快照保留数量
    history-size: 10
    # 网络质量上报间隔（毫秒）
    quality-report-interval: 2000