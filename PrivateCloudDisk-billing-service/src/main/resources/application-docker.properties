spring.application.name=PrivateCloudDisk-billing-service
server.port=8083

# ============================================================
# 数据源配置
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/private_cloud_disk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================================
# Redis 配置
# ============================================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:1}
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3s

# ============================================================
# RabbitMQ 配置
# ============================================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ============================================================
# 支付配置 (支付宝/微信/Apple IAP)
# ============================================================
payment.alipay.enabled=${PAYMENT_ALIPAY_ENABLED:false}
payment.alipay.app-id=${PAYMENT_ALIPAY_APP_ID:}
payment.alipay.private-key=${PAYMENT_ALIPAY_PRIVATE_KEY:}
payment.alipay.alipay-public-key=${PAYMENT_ALIPAY_ALIPAY_PUBLIC_KEY:}
payment.alipay.notify-url=${PAYMENT_ALIPAY_NOTIFY_URL:https://www.hellomyservice.xyz/api/billing/callback/alipay}
payment.alipay.return-url=${PAYMENT_ALIPAY_RETURN_URL:https://www.hellomyservice.xyz/payment/result}

payment.wechat.enabled=${PAYMENT_WECHAT_ENABLED:false}
payment.wechat.app-id=${PAYMENT_WECHAT_APP_ID:}
payment.wechat.mch-id=${PAYMENT_WECHAT_MCH_ID:}
payment.wechat.api-key=${PAYMENT_WECHAT_API_KEY:}
payment.wechat.api-v3-key=${PAYMENT_WECHAT_API_V3_KEY:}
payment.wechat.notify-url=${PAYMENT_WECHAT_NOTIFY_URL:https://www.hellomyservice.xyz/api/billing/callback/wechat}

payment.apple-iap.enabled=${PAYMENT_APPLE_IAP_ENABLED:false}
payment.apple-iap.shared-secret=${PAYMENT_APPLE_IAP_SHARED_SECRET:}
payment.apple-iap.verify-url=${PAYMENT_APPLE_IAP_VERIFY_URL:https://buy.itunes.apple.com/verifyReceipt}
payment.apple-iap.sandbox-url=${PAYMENT_APPLE_IAP_SANDBOX_URL:https://sandbox.itunes.apple.com/verifyReceipt}

# ============================================================
# 计费业务配置
# ============================================================
billing.order.expire-minutes=${BILLING_ORDER_EXPIRE_MINUTES:30}
billing.subscription.grace-period-days=${BILLING_GRACE_PERIOD_DAYS:7}
billing.overage.billing-cycle-day=${BILLING_OVERAGE_BILLING_DAY:1}
billing.invoice.auto-issue=${BILLING_INVOICE_AUTO_ISSUE:false}

# ============================================================
# Nacos 配置
# ============================================================
spring.cloud.nacos.discovery.enabled=${NACOS_DISCOVERY_ENABLED:true}
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:nacos:8848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos123}
spring.cloud.nacos.config.enabled=${NACOS_CONFIG_ENABLED:true}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:nacos:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.file-extension=${NACOS_CONFIG_FILE_EXT:yaml}

# ============================================================
# Sentinel 配置
# ============================================================
spring.cloud.sentinel.enabled=${SENTINEL_ENABLED:true}
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD:localhost:8858}
spring.cloud.sentinel.transport.port=${SENTINEL_TRANSPORT_PORT:8721}
spring.cloud.sentinel.eager=${SENTINEL_EAGER:true}

# ============================================================
# Seata 分布式事务
# ============================================================
seata.enabled=${SEATA_ENABLED:true}
seata.tx-service-group=${SEATA_TX_GROUP:private_cloud_disk_tx_group}
seata.registry.type=nacos
seata.registry.nacos.application=seata-server
seata.registry.nacos.server-addr=${NACOS_SERVER_ADDR:nacos:8848}
seata.registry.nacos.group=SEATA_GROUP
seata.config.type=nacos
seata.config.nacos.server-addr=${NACOS_SERVER_ADDR:nacos:8848}
seata.config.nacos.group=SEATA_GROUP
seata.application-id=${spring.application.name}

# ============================================================
# XXL-Job 配置
# ============================================================
xxl.job.enabled=${XXL_JOB_ENABLED:true}
xxl.job.admin.addresses=${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job:8089/xxl-job-admin}
xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:xxl-job-access-token-2024}
xxl.job.executor.appname=${XXL_JOB_EXECUTOR_APPNAME:${spring.application.name}}
xxl.job.executor.port=${XXL_JOB_EXECUTOR_PORT:9998}
xxl.job.executor.logpath=${XXL_JOB_EXECUTOR_LOGPATH:/var/log/xxl-job}
xxl.job.executor.logretentiondays=${XXL_JOB_EXECUTOR_LOGRETENTIONDAYS:30}

# ============================================================
# Actuator + Prometheus
# ============================================================
management.endpoints.web.exposure.include=${MANAGEMENT_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ============================================================
# Redisson
# ============================================================
spring.redisson.enabled=${REDISSON_ENABLED:true}
spring.redisson.address=redis://${SPRING_DATA_REDIS_HOST:redis}:${SPRING_DATA_REDIS_PORT:6379}
spring.redisson.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.redisson.database=${SPRING_DATA_REDIS_DATABASE:1}

# ============================================================
# SpringDoc OpenAPI
# ============================================================
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging.level.root=INFO
logging.level.org.project=DEBUG