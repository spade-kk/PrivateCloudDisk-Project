appId: com.privateclouddisk.desktop
productName: PrivateCloudDisk
copyright: Copyright © 2024 PrivateCloudDisk Team

# Electron 入口
files:
  - src/main/**/*
  - src/preload/**/*
  - build/renderer/**/*
  - resources/**/*
  - package.json

directories:
  output: dist
  buildResources: resources

nodeGypRebuild: false
npmRebuild: false
compression: maximum
asar: true

extraResources:
  - from: resources/splash.html
    to: splash.html
  - from: src/main/virtual-disk/daemon.js
    to: virtual-disk/daemon.js

asarUnpack:
  - "node_modules/better-sqlite3/**"

# ========== macOS ==========
mac:
  category: public.app-category.productivity
  icon: resources/icons/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: 用于录制音频
    NSCameraUsageDescription: 用于拍照上传

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: PrivateCloudDisk Installer
  icon: resources/icons/icon.icns
  background: resources/icons/dmg-background.png
  contents:
    - { x: 130, y: 220, type: link, path: /Applications }
    - { x: 410, y: 220, type: file }

# ========== Windows ==========
win:
  icon: resources/icons/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico

# ========== Linux ==========
linux:
  icon: resources/icons
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility

# ========== 自动更新 ==========
publish:
  provider: generic
  url: https://update.privateclouddisk.com/releases/