<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>PrivateCloudDisk</title>
  <style>
    /* ==========================================
       Reset & Base
       ========================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
      /* 圆角裁剪 (配合 transparent 窗口) */
      border-radius: 16px;
    }

    /* ==========================================
       Container
       ========================================== */
    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }

    /* 软阴影模拟边框 (透明窗口下) */
    .splash-container::after {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    /* 淡入效果 */
    .splash-container.splash-visible {
      opacity: 1;
    }

    /* 淡出效果 */
    .splash-container.splash-fade-out {
      opacity: 0;
      transition: opacity 0.35s ease-in;
      transform: scale(0.97);
    }

    /* ==========================================
       Background Decorations
       ========================================== */

    /* 左上角光晕 */
    .bg-glow-1 {
      position: absolute;
      top: -80px;
      left: -60px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    /* 右下角光晕 */
    .bg-glow-2 {
      position: absolute;
      bottom: -100px;
      right: -80px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    /* 网格纹理 */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      border-radius: 16px;
      pointer-events: none;
    }

    /* ==========================================
       Logo Area
       ========================================== */
    .logo-wrapper {
      position: relative;
      z-index: 1;
      margin-bottom: 20px;
      animation: logo-enter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes logo-enter {
      0% {
        opacity: 0;
        transform: translateY(-12px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 云朵 Logo (纯 CSS 绘制) */
    .cloud-logo {
      width: 88px;
      height: 88px;
      position: relative;
    }

    .cloud-logo .cloud-body {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 28px;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #0ea5e9 100%);
      border-radius: 28px;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.4), 0 0 60px rgba(59, 130, 246, 0.15);
    }

    /* 云朵上的圆环 */
    .cloud-logo .cloud-circle-1 {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
      border-radius: 50%;
      box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
    }

    .cloud-logo .cloud-circle-2 {
      position: absolute;
      bottom: 20px;
      left: calc(50% - 28px);
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    .cloud-logo .cloud-circle-3 {
      position: absolute;
      bottom: 20px;
      left: calc(50% + 4px);
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.3);
    }

    /* 云朵呼吸动画 */
    .cloud-logo {
      animation: cloud-float 3s ease-in-out infinite;
    }

    @keyframes cloud-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ==========================================
       App Name & Tagline
       ========================================== */
    .app-name-wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: name-enter 0.7s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes name-enter {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 50%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .app-tagline {
      font-size: 13px;
      font-weight: 400;
      color: rgba(148, 163, 184, 0.8);
      letter-spacing: 1px;
    }

    /* ==========================================
       Loading Area
       ========================================== */
    .loading-wrapper {
      position: relative;
      z-index: 1;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: loading-enter 0.7s 0.3s ease both;
    }

    @keyframes loading-enter {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* 进度条轨道 */
    .progress-track {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    /* 进度条填充 */
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #3b82f6, #0ea5e9);
      background-size: 200% 100%;
      border-radius: 3px;
      transition: width 0.4s ease-out;
      animation: progress-shimmer 2s linear infinite;
    }

    @keyframes progress-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 初始不确定状态的无限进度条 */
    .progress-fill.indeterminate {
      width: 40% !important;
      animation: indeterminate-slide 1.5s ease-in-out infinite, progress-shimmer 2s linear infinite;
    }

    @keyframes indeterminate-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* 状态文字 */
    .status-text {
      font-size: 12px;
      color: rgba(148, 163, 184, 0.6);
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity 0.3s ease;
      min-height: 18px;
    }

    .status-text.status-visible {
      opacity: 1;
    }

    /* ==========================================
       Bottom: Version
       ========================================== */
    .version-text {
      position: absolute;
      bottom: 20px;
      z-index: 1;
      font-size: 11px;
      color: rgba(100, 116, 139, 0.5);
      letter-spacing: 0.5px;
      animation: version-enter 0.7s 0.5s ease both;
    }

    @keyframes version-enter {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* ==========================================
       macOS 窗口控制按钮 (仅视觉装饰)
       ========================================== */
    .window-controls {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 8px;
      z-index: 2;
      opacity: 0.4;
    }

    .window-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .window-dot.red   { background: #ff5f57; }
    .window-dot.amber { background: #febc2e; }
    .window-dot.green { background: #28c840; }
  </style>
</head>
<body>

  <div class="splash-container" id="splash-container">
    <!-- 背景装饰 -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-grid"></div>

    <!-- 窗口控制点装饰 (macOS 风格) -->
    <div class="window-controls">
      <div class="window-dot red"></div>
      <div class="window-dot amber"></div>
      <div class="window-dot green"></div>
    </div>

    <!-- Logo -->
    <div class="logo-wrapper">
      <div class="cloud-logo">
        <div class="cloud-circle-3"></div>
        <div class="cloud-circle-2"></div>
        <div class="cloud-circle-1"></div>
        <div class="cloud-body"></div>
      </div>
    </div>

    <!-- 应用名称 -->
    <div class="app-name-wrapper">
      <div class="app-name">PrivateCloudDisk</div>
      <div class="app-tagline">企业私有云盘</div>
    </div>

    <!-- 加载进度 -->
    <div class="loading-wrapper">
      <div class="progress-track">
        <div class="progress-fill indeterminate" id="splash-progress-bar"></div>
      </div>
      <div class="status-text" id="splash-status">正在初始化...</div>
    </div>

    <!-- 版本号 -->
    <div class="version-text">Version 1.0.0</div>
  </div>

  <script>
    // 页面加载后显示淡入动画
    // (由主进程在 did-finish-load 后调用)
    document.addEventListener('DOMContentLoaded', function () {
      // 如果主进程未及时触发, 2 秒后自动显示
      setTimeout(function () {
        var container = document.getElementById('splash-container')
        if (container && !container.classList.contains('splash-visible')) {
          container.classList.add('splash-visible')
        }
      }, 2000)
    })

    // 状态文字会由主进程通过 executeJavaScript 动态更新
    // 示例: updateStatus('正在加载配置...') / updateProgress(50)
  </script>

</body>
</html>
