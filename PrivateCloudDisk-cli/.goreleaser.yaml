# 发布说明
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# 发布配置
release:
  github:
    owner: privateclouddisk
    name: cli
  draft: true
  prerelease: auto
  mode: replace
  header: |
    ## PrivateCloudDisk CLI {{ .Version }}

    ### 安装

    **macOS / Linux:**
    ```bash
    curl -fsSL https://github.com/privateclouddisk/cli/releases/download/{{ .Version }}/pcd_{{ .Version }}_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m).tar.gz | tar -xz
    sudo mv pcd /usr/local/bin/
    ```

    **Windows (PowerShell):**
    ```powershell
    Invoke-WebRequest -Uri "https://github.com/privateclouddisk/cli/releases/download/{{ .Version }}/pcd_{{ .Version }}_windows_amd64.zip" -OutFile pcd.zip
    Expand-Archive pcd.zip -DestinationPath .
    ```
  footer: |
    ### 校验和
    ```
    {{ range .Artifacts }}
    {{ .Name }}: {{ .Checksum }}
    {{ end }}
    ```

# 公告配置
announce:
  # 可选: 发到 Discord / Slack
  # discord:
  #   enabled: true
  #   message_template: "New release {{ .Tag }} is out!"
  skip: true