# GoReleaser 配置 - 自动多平台发布
# 文档: https://goreleaser.com

# 项目元数据
project_name: pcd
before:
  hooks:
    - go mod tidy
    - go mod download

# 构建配置
builds:
  - id: pcd
    # 入口文件
    main: .
    # 输出二进制名称
    binary: pcd
    # 多平台/架构
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # 忽略某些组合
    ignore:
      - goos: windows
        goarch: arm64
    # 构建标志
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildTime={{.Date}}
    # 环境变量
    env:
      - CGO_ENABLED=0
    # 模版化文件名
    mod_timestamp: "{{ .CommitTimestamp }}"

# 归档配置
archives:
  - id: default
    # 格式: tar.gz 和 zip
    formats:
      - tar.gz
      - zip
    # Windows 默认使用 zip
    format_overrides:
      - goos: windows
        formats:
          - zip
    # 归档内文件名模板
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    # 包含的文件
    files:
      - README.md
      - LICENSE
      - completions/*

# 校验和
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# 签名 (可选，需要 GPG 密钥)
# signs:
#   - artifacts: checksum
#     args: ["--batch", "-u", "{{ .Env.GPG_FINGERPRINT }}", "--output", "${signature}", "--detach-sign", "${artifact}"]

