# GitHub Actions CI/CD 自动发布工作流
# .github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: 1.0.0)"
        required: false
        default: ""

jobs:
  # ============================================================
  # 测试
  # ============================================================
  test:
    name: 测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: 安装依赖
        run: go mod download

      - name: 代码检查 (vet)
        run: go vet ./...

      - name: 运行测试
        run: go test -v -race -count=1 ./...

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out

  # ============================================================
  # 静态分析
  # ============================================================
  lint:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ============================================================
  # 构建与发布
  # ============================================================
  release:
    name: 构建与发布
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: 生成 Shell 补全脚本
        run: |
          mkdir -p completions
          go run . completion bash > completions/pcd.bash
          go run . completion zsh > completions/pcd.zsh
          go run . completion fish > completions/pcd.fish
          go run . completion powershell > completions/pcd.ps1

      - name: GoReleaser 发布
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 独立多平台构建 (非发布模式)
  # ============================================================
  build:
    name: 多平台构建
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT="pcd"
          if [ "$GOOS" = "windows" ]; then
            OUTPUT="pcd.exe"
          fi
          go build -ldflags "-s -w" -o "dist/${OUTPUT}_${GOOS}_${GOARCH}" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pcd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pcd_${{ matrix.goos }}_${{ matrix.goarch }}*