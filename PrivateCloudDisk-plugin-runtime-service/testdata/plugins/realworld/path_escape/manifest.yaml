manifest_version: 1
plugin:
  id: 4234560d-4183-fcff-1d92-cdd2455b98c6
  name: 路径逃逸尝试
  type: CLOUD_PLUGIN
  version: 1.0.0
runtime:
  language: python
  version: "3.11"
permissions:
  - file.content.read_staging
  - platform.capability.invoke
entrypoints:
  events:
  - event: pcd.file.content.ready.v1
    module: src/main.py
    function: main
    priority: 10
    permissions:
      - file.content.read_staging
      - platform.capability.invoke
exports:
  - name: read_file
    module: src/main.py
    function: main
    permissions:
      - file.content.read_staging
      - platform.capability.invoke
