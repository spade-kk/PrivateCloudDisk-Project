manifest_version: 1
plugin:
  id: dae57e2e-800f-abed-964a-5dcb4a5ec050
  name: 多步骤入口链插件包
  type: CLOUD_PLUGIN
  version: 1.0.0
runtime:
  language: python
  version: "3.11"
permissions:
  - file.content.read_staging
  - file.content.write_pre_activation
entrypoints:
  events:
  - event: pcd.file.content.ready.v1
    module: src/step_a.py
    function: main
    priority: 10
    permissions:
      - file.content.read_staging
      - file.content.write_pre_activation
  - event: pcd.file.content.ready.v1
    module: src/step_b.py
    function: main
    priority: 20
    permissions:
      - file.content.read_staging
      - file.content.write_pre_activation
