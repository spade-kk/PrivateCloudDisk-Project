# ============================================================
# PrivateCloudDisk - Docker Compose 编排
# 
# 中间件 Dockerfile 统一管理在 PrivateCloudDisk-infra/ 目录下:
#   mysql/     redis/     rabbitmq/     minio/     opensearch/     apisix/
# ============================================================
version: '1.0'

networks:
  app-networks:
    driver: bridge

# 数据卷：持久化数据
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  uploads-data:
  opensearch-data:
  minio-data:

services:
  # ============================================================
  #                         中间件层
  # ============================================================

  # -------------------- MySQL 8.0 --------------------
  mysql:
    build: ./PrivateCloudDisk-infra/mysql
    container_name: project-mysql
    networks:
      - app-networks
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: private_cloud_disk
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- Redis 7 --------------------
  redis:
    build: ./PrivateCloudDisk-infra/redis
    container_name: project-redis
    networks:
      - app-networks
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- RabbitMQ 3 --------------------
  rabbitmq:
    build: ./PrivateCloudDisk-infra/rabbitmq
    container_name: project-rabbitmq
    networks:
      - app-networks
    expose:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- MinIO 对象存储 --------------------
  minio:
    build: ./PrivateCloudDisk-infra/minio
    container_name: project-minio
    networks:
      - app-networks
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- OpenSearch 2.10（含 analysis-ik） --------------------
  opensearch:
    build: ./PrivateCloudDisk-infra/opensearch
    container_name: project-opensearch
    networks:
      - app-networks
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MySecureP@ssw0rd
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    expose:
      - "9200"
      - "9600"
    restart: always

  # -------------------- APISIX API 网关（含 Coraza WAF） --------------------
  apisix:
    build: ./PrivateCloudDisk-infra/apisix
    container_name: project-apisix
    networks:
      - app-networks
    ports:
      - "9080:9080"   # HTTP 代理端口
      - "9443:9443"   # HTTPS 代理端口
      - "9180:9180"   # Admin API 端口（管理接口）
    restart: always
    depends_on:
      - gateway-service-backend

  # ============================================================
  #                         业务服务层
  # ============================================================

  # -------------------- SpringBoot 网关服务 --------------------
  gateway-service-backend:
    build: ./PrivateCloudDisk-gateway-service
    container_name: backend-gateway-service
    networks:
      - app-networks
    expose:
      - "8080"
    depends_on:
      - platform-service-backend
      - file-service-backend
    environment:
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081
      FILE_SERVICE_URL: http://file-service-backend:8000
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
    restart: always

  # -------------------- SpringBoot 业务服务 --------------------
  platform-service-backend:
    build: ./PrivateCloudDisk-platform-service
    container_name: backend-platform-service
    networks:
      - app-networks
    expose:
      - "8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/private_cloud_disk?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SECURITY_CAPTCHA_TURNSTILE_ENABLED: ${SECURITY_CAPTCHA_TURNSTILE_ENABLED:-false}
      SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY: ${SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY:-0x4AAAAAADf7Z-kpJMtKhi_3xlpjOjBm42w}
      SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME: ${SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME:-www.hellomyservice.xyz}
    restart: always

  # -------------------- FastAPI 文件服务 --------------------
  file-service-backend:
    build: ./PrivateCloudDisk-shortage-service
    container_name: backend-file-service
    networks:
      - app-networks
    expose:
      - "8000"
    depends_on:
      - platform-service-backend
    environment:
      FILE_UPLOAD_DIR: /data/uploads
      QUARANTINE_DIR: /data/uploads/quarantine
      REDIS_URL: redis://redis:6379/0
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081

      PRIVATE_KEY_PATH: /backend_file_service/private_key.pem
      PUBLIC_KEY_PATH: /backend_file_service/public_key.pem

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      OPENSEARCH_HOST: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: MySecureP@ssw0rd
      OPENSEARCH_USE_SSL: true
      OPENSEARCH_VERIFY_CERTS: false
      OPENSEARCH_TIMEOUT: 30
      OPENSEARCH_MAX_RETRIES: 3
      OPENSEARCH_FILE_INDEX: pcd_file_basic
      OPENSEARCH_CONTENT_INDEX: pcd_file_content

      MAX_CONCURRENT: 3
      OPERATION_TOKEN_EXPIRE_SECONDS: 3600
      MAX_REQUESTS_PER_OPERATION_TOKEN: 300
      RATE_PER_SEC: 10
      MAX_RANGE_BYTES: 104857600
      THUMBNAIL_TTL: 3600
      OPERATION_TOKEN_ISSUE_FILE_LIMIT: 10
      OPERATION_TOKEN_ISSUE_FILE_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_USER_LIMIT: 60
      OPERATION_TOKEN_DESTROY_USER_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_IP_LIMIT: 180
      OPERATION_TOKEN_DESTROY_IP_WINDOW_SECONDS: 60
    volumes:
      - uploads-data:/data/uploads
    restart: always

  # -------------------- FastAPI Worker 文件处理消费者 --------------------
  file-service-worker:
    build: ./PrivateCloudDisk-shortage-service
    container_name: backend-file-worker
    networks:
      - app-networks
    command: python worker.py
    depends_on:
      - rabbitmq
      - redis
      - platform-service-backend
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      FILE_UPLOAD_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081
      PRIVATE_KEY_PATH: /backend_file_service/private_key.pem
      PUBLIC_KEY_PATH: /backend_file_service/public_key.pem

      OPENSEARCH_HOST: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: MySecureP@ssw0rd
      OPENSEARCH_USE_SSL: true
      OPENSEARCH_VERIFY_CERTS: false
      OPENSEARCH_TIMEOUT: 30
      OPENSEARCH_MAX_RETRIES: 3
      OPENSEARCH_FILE_INDEX: pcd_file_basic
      OPENSEARCH_CONTENT_INDEX: pcd_file_content

      MAX_CONCURRENT: 3
      OPERATION_TOKEN_EXPIRE_SECONDS: 3600
    volumes:
      - uploads-data:/data/uploads
    restart: always

  # ============================================================
  #                         前端层
  # ============================================================

  # -------------------- Vue 前端 --------------------
  frontend:
    build:
      context: ./PrivateCloudDisk-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAADf7Z44g-izJGKIB}
        VITE_CHUNK_SIZE: ${VITE_CHUNK_SIZE:-5242880}
        VITE_MAX_CONCURRENT_UPLOADS: ${VITE_MAX_CONCURRENT_UPLOADS:-3}
        VITE_MAX_CONCURRENT_DOWNLOADS: ${VITE_MAX_CONCURRENT_DOWNLOADS:-4}
        VITE_UPLOAD_THRESHOLD: ${VITE_UPLOAD_THRESHOLD:-10485760}
    container_name: private-cloud-web
    networks:
      - app-networks
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - gateway-service-backend
    restart: always

  # ============================================================
  #                         证书管理
  # ============================================================

  certbot:
    image: certbot/certbot:latest
    container_name: private-cloud-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-networks
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"