# ============================================================
# PrivateCloudDisk - Docker Compose 编排
# 
# 中间件 Dockerfile 统一管理在 PrivateCloudDisk-infra/ 目录下:
#   mysql/  redis/  rabbitmq/  minio/  opensearch/  skywalking/  skywalking-ui/  apisix/
# ============================================================
version: '1.0'

networks:
  app-networks:
    driver: bridge

# 数据卷：持久化数据
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  uploads-data:
  opensearch-data:
  minio-data:
  ai-models:
  # 插件包只由 Plugin Service 读写，Runtime 通过受信内部接口按摘要下载。
  plugin-repo:
  # [REQ-GIT-SPACE-3.1/6.1] Git 裸仓库只作协议缓存；权威对象由 StorageProvider 共享存储池持久化。
  git-repo-cache:
  # 下载文件卷（与 uploader 共享，可选 bind mount 替代）
  # 若使用 bind mount 方式（CI/CD 直接 rsync），取消下面注释：
  #   frontend 和 uploader 均改为 bind mount 到 ./downloads/binaries
  downloads-binaries:

services:
  # ============================================================
  #                         中间件层
  # ============================================================

  # -------------------- MySQL 8.0 --------------------
  mysql:
    build: ./PrivateCloudDisk-infra/mysql
    container_name: project-mysql
    networks:
      - app-networks
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MySQL root 密码}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-private_cloud_disk}
      PLUGIN_DATASOURCE_PASSWORD: ${PLUGIN_DATASOURCE_PASSWORD:?必须设置插件数据库密码}
      AUTOMATION_DATASOURCE_PASSWORD: ${AUTOMATION_DATASOURCE_PASSWORD:?必须设置自动化数据库密码}
      WORKFLOW_DATASOURCE_PASSWORD: ${WORKFLOW_DATASOURCE_PASSWORD:?必须设置工作流数据库密码}
      CLOUDFLOW_DATASOURCE_PASSWORD: ${CLOUDFLOW_DATASOURCE_PASSWORD:?必须设置 CloudFlow 数据库密码}
      SCHEDULER_DATASOURCE_PASSWORD: ${SCHEDULER_DATASOURCE_PASSWORD:?必须设置调度数据库密码}
      CLIENT_REGISTRATION_DB_PASSWORD: ${CLIENT_REGISTRATION_DB_PASSWORD:?必须设置客户端注册数据库密码}
      GIT_DATASOURCE_PASSWORD: ${GIT_DATASOURCE_PASSWORD:?必须设置 Git 数据库密码}
    volumes:
      - mysql-data:/var/lib/mysql
      # 新部署自动创建生命周期闸门表；存量部署需按发布说明单独执行该迁移。
      - ./PrivateCloudDisk-db/008_file_preprocess_lifecycle.sql:/docker-entrypoint-initdb.d/30-file-preprocess-lifecycle.sql:ro
      # [REQ-GIT-SPACE-2.2] 新部署补充空间资源类型；存量环境按迁移说明执行 014 脚本。
      - ./PrivateCloudDisk-db/014_space_resource_type.sql:/docker-entrypoint-initdb.d/31-space-resource-type.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- Redis 7 --------------------
  redis:
    build: ./PrivateCloudDisk-infra/redis
    container_name: project-redis
    networks:
      - app-networks
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- RabbitMQ 3 --------------------
  rabbitmq:
    build: ./PrivateCloudDisk-infra/rabbitmq
    container_name: project-rabbitmq
    networks:
      - app-networks
    expose:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- MinIO 对象存储 --------------------
  minio:
    build: ./PrivateCloudDisk-infra/minio
    container_name: project-minio
    networks:
      - app-networks
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?必须设置 MinIO 管理用户名}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须设置 MinIO 管理密码}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- OpenSearch 2.10（含 analysis-ik） --------------------
  opensearch:
    build: ./PrivateCloudDisk-infra/opensearch
    container_name: project-opensearch
    networks:
      - app-networks
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true    # 完全禁用安全
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?必须设置 OpenSearch 管理密码}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    expose:
      - "9200"
      - "9600"
    restart: always
    # 添加健康检查
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # ==================== SkyWalking OAP Server（链路追踪后端） ====================
  skywalking-oap:
    build: ./PrivateCloudDisk-infra/skywalking
    container_name: project-skywalking-oap
    networks:
      - app-networks
    expose:
      - "11800"   # gRPC（Java Agent 上报）
      - "12800"   # HTTP（Python Agent / UI 查询）
    ports:
      - "1234:1234"   # Prometheus 指标（可选）
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: opensearch:9200
      SW_STORAGE_ES_HTTP_PROTOCOL: http
      SW_STORAGE_ES_SSL_ENABLED: "false"
      SW_STORAGE_ES_INDEX_SHARDS_NUMBER: 1
      SW_STORAGE_ES_INDEX_REPLICAS_NUMBER: 0
      SW_CORE_RECORD_DATA_TTL: 7
      SW_CORE_METRICS_DATA_TTL: 7
      SW_CORE_TRACE_DATA_TTL: 7
      JAVA_OPTS: -Xms512m -Xmx1g
    depends_on:
        opensearch:
          condition: service_healthy          # 添加健康检查依赖
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:12800/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== SkyWalking UI（链路追踪可视化） ====================
  skywalking-ui:
    build: ./PrivateCloudDisk-infra/skywalking-ui
    container_name: project-skywalking-ui
    networks:
      - app-networks
    ports:
      - "8082:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      SW_TIMEOUT: 60000
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      - skywalking-oap
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  #                         业务服务层
  # ============================================================

  # -------------------- SpringBoot 网关服务 --------------------
  gateway-service-backend:
    build: ./PrivateCloudDisk-gateway-service
    container_name: backend-gateway-service
    networks:
      - app-networks
    expose:
      - "8080"
    depends_on:
      - platform-service-backend
      - file-service-backend
      - git-service-backend
    environment:
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081
      FILE_SERVICE_URL: http://file-service-backend:8000
      PLUGIN_SERVICE_URL: http://plugin-service-backend:8085
      WORKFLOW_SERVICE_URL: http://workflow-service-backend:8087
      CLIENT_REGISTRATION_SERVICE_URL: http://client-registration-service:8089
      GIT_SERVICE_URL: http://git-service-backend:8091
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      # SkyWalking Agent
      SW_AGENT_NAME: PrivateCloudDisk-gateway-service
      SW_AGENT_BACKEND: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_LOGGING_LEVEL: INFO
      SW_SAMPLE_RATE: "-1"
    restart: always

  # -------------------- Client Registration 设备身份与本地插件绑定 --------------------
  client-registration-service:
    build: ./PrivateCloudDisk-client-registration-service
    container_name: backend-client-registration-service
    networks:
      - app-networks
    expose:
      - "8089"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_PATH: /app/config/config.yaml
      SERVER_PORT: 8089
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: pcd_client
      DB_PASSWORD: ${CLIENT_REGISTRATION_DB_PASSWORD:?必须设置客户端注册数据库密码}
      DB_NAME: private_cloud_disk
      REDIS_ADDR: redis:6379
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
      GIN_MODE: release
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # -------------------- SpringBoot 业务服务 --------------------
  platform-service-backend:
    build: ./PrivateCloudDisk-platform-service
    container_name: backend-platform-service
    networks:
      - app-networks
    expose:
      - "8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/private_cloud_disk?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MySQL root 密码}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}
      # Sprint 0：所有 /business/internal/** 调用必须携带同一份服务凭证。
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
      SECURITY_CAPTCHA_TURNSTILE_ENABLED: ${SECURITY_CAPTCHA_TURNSTILE_ENABLED:-false}
      SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY: ${SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY:-0x4AAAAAADf7Z-kpJMtKhi_3xlpjOjBm42w}
      SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME: ${SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME:-www.hellomyservice.xyz}
      SPRINGDOC_API_DOCS_ENABLED: true
      SPRINGDOC_SWAGGER_UI_ENABLED: true
      # SkyWalking Agent
      SW_AGENT_NAME: PrivateCloudDisk-platform-service
      SW_AGENT_BACKEND: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_LOGGING_LEVEL: INFO
      SW_SAMPLE_RATE: "-1"
    restart: always

  # -------------------- SpringBoot 计费与订阅服务 --------------------
  billing-service-backend:
    build: ./PrivateCloudDisk-billing-service
    container_name: backend-billing-service
    networks:
      - app-networks
    expose:
      - "8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/private_cloud_disk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      # Sprint 0 安全基线：生产密钥只允许由部署环境注入，不再把数据库口令写入编排文件。
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在部署环境配置 MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 1
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在部署环境配置 RABBITMQ_PASSWORD}
      # SkyWalking Agent
      SW_AGENT_NAME: PrivateCloudDisk-billing-service
      SW_AGENT_BACKEND: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_LOGGING_LEVEL: INFO
      SW_SAMPLE_RATE: "-1"
      # 支付配置 (默认关闭，生产环境通过环境变量注入)
      PAYMENT_ALIPAY_ENABLED: ${PAYMENT_ALIPAY_ENABLED:-false}
      PAYMENT_ALIPAY_APP_ID: ${PAYMENT_ALIPAY_APP_ID:-}
      PAYMENT_ALIPAY_PRIVATE_KEY: ${PAYMENT_ALIPAY_PRIVATE_KEY:-}
      PAYMENT_ALIPAY_ALIPAY_PUBLIC_KEY: ${PAYMENT_ALIPAY_ALIPAY_PUBLIC_KEY:-}
      PAYMENT_WECHAT_ENABLED: ${PAYMENT_WECHAT_ENABLED:-false}
      PAYMENT_WECHAT_APP_ID: ${PAYMENT_WECHAT_APP_ID:-}
      PAYMENT_WECHAT_MCH_ID: ${PAYMENT_WECHAT_MCH_ID:-}
      PAYMENT_WECHAT_API_KEY: ${PAYMENT_WECHAT_API_KEY:-}
      PAYMENT_WECHAT_API_V3_KEY: ${PAYMENT_WECHAT_API_V3_KEY:-}
      PAYMENT_APPLE_IAP_ENABLED: ${PAYMENT_APPLE_IAP_ENABLED:-false}
      PAYMENT_APPLE_IAP_SHARED_SECRET: ${PAYMENT_APPLE_IAP_SHARED_SECRET:-}
      # 计费业务配置
      BILLING_ORDER_EXPIRE_MINUTES: ${BILLING_ORDER_EXPIRE_MINUTES:-30}
      BILLING_GRACE_PERIOD_DAYS: ${BILLING_GRACE_PERIOD_DAYS:-7}
      # 企业级中间件
      NACOS_DISCOVERY_ENABLED: ${NACOS_DISCOVERY_ENABLED:-true}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos123}
      SEATA_ENABLED: ${SEATA_ENABLED:-true}
      SENTINEL_ENABLED: ${SENTINEL_ENABLED:-true}
      SENTINEL_DASHBOARD: ${SENTINEL_DASHBOARD:-sentinel:8858}
      XXL_JOB_ENABLED: ${XXL_JOB_ENABLED:-true}
      XXL_JOB_ADMIN_ADDRESSES: ${XXL_JOB_ADMIN_ADDRESSES:-http://xxl-job:8089/xxl-job-admin}
      REDISSON_ENABLED: ${REDISSON_ENABLED:-true}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # -------------------- FastAPI 文件服务 --------------------
  file-service-backend:
    build: ./PrivateCloudDisk-storage-service
    container_name: backend-file-service
    networks:
      - app-networks
    expose:
      - "8000"
      - "8719"
    depends_on:
      - platform-service-backend
    environment:
      # OpenAPI 文档：生产环境默认关闭，调试时设为 true
      ENABLE_DOCS: ${ENABLE_DOCS:-false}

      FILE_UPLOAD_DIR: /data/uploads
      QUARANTINE_DIR: /data/uploads/quarantine
      REDIS_URL: redis://redis:6379/0
      # Sprint 0：内部存储回调走容器私网直连，不再经过公网 Gateway。
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
      # AUDIT FIX [8.3]: 预览资源元数据、播放进度和死信台账持久化连接。
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MySQL root 密码}
      MYSQL_DATABASE: private_cloud_disk
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}

      PRIVATE_KEY_PATH: /backend_file_service/private_key.pem
      PUBLIC_KEY_PATH: /backend_file_service/public_key.pem

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}

      OPENSEARCH_HOST: http://opensearch:9200
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_TIMEOUT: 30
      OPENSEARCH_MAX_RETRIES: 3
      OPENSEARCH_FILE_INDEX: pcd_file_basic
      OPENSEARCH_CONTENT_INDEX: pcd_file_content

      MAX_CONCURRENT: 3
      OPERATION_TOKEN_EXPIRE_SECONDS: 3600
      MAX_REQUESTS_PER_OPERATION_TOKEN: 300
      RATE_PER_SEC: 10
      MAX_RANGE_BYTES: 104857600
      # 需求三：原始内容 Preview Token 的短有效期、并发和体积边界，可按环境覆盖。
      PREVIEW_GRANT_TTL_SECONDS: ${PREVIEW_GRANT_TTL_SECONDS:-120}
      PREVIEW_GRANT_USER_MAX_ACTIVE: ${PREVIEW_GRANT_USER_MAX_ACTIVE:-6}
      PREVIEW_GRANT_USER_IP_MAX_ACTIVE: ${PREVIEW_GRANT_USER_IP_MAX_ACTIVE:-3}
      PREVIEW_GRANT_MAX_REQUESTS: ${PREVIEW_GRANT_MAX_REQUESTS:-24}
      PREVIEW_GRANT_RATE_PER_SEC: ${PREVIEW_GRANT_RATE_PER_SEC:-6}
      PREVIEW_GRANT_MAX_CONCURRENT: ${PREVIEW_GRANT_MAX_CONCURRENT:-2}
      PREVIEW_TEXT_MAX_BYTES: ${PREVIEW_TEXT_MAX_BYTES:-10485760}
      PREVIEW_IMAGE_MAX_BYTES: ${PREVIEW_IMAGE_MAX_BYTES:-26214400}
      PREVIEW_MAX_RANGE_BYTES: ${PREVIEW_MAX_RANGE_BYTES:-8388608}
      # [REQ-GIT-SPACE-6.2] Git 对象内部代理使用独立限额，避免沿用浏览器预览边界。
      GIT_OBJECT_MAX_BYTES: ${GIT_OBJECT_MAX_BYTES:-2147483648}
      GIT_OBJECT_MAX_RANGE_BYTES: ${GIT_OBJECT_MAX_RANGE_BYTES:-67108864}
      THUMBNAIL_TTL: 3600
      OPERATION_TOKEN_ISSUE_FILE_LIMIT: 10
      OPERATION_TOKEN_ISSUE_FILE_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_USER_LIMIT: 60
      OPERATION_TOKEN_DESTROY_USER_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_IP_LIMIT: 180
      OPERATION_TOKEN_DESTROY_IP_WINDOW_SECONDS: 60
      # SkyWalking Python Agent
      SW_AGENT_NAME: PrivateCloudDisk-storage-service
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_AGENT_LOGGING_LEVEL: INFO
    volumes:
      - uploads-data:/data/uploads
    restart: always

  # -------------------- FastAPI Worker 文件处理消费者 --------------------
  file-service-worker:
    build: ./PrivateCloudDisk-storage-service
    container_name: backend-file-worker
    networks:
      - app-networks
    command: sw-python run python worker.py
    depends_on:
      - rabbitmq
      - redis
      - mysql
      - platform-service-backend
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}

      FILE_UPLOAD_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      # Sprint 0：Worker 与业务服务通过 Docker 私网通信。
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MySQL root 密码}
      MYSQL_DATABASE: private_cloud_disk
      # 需求一-3：可选的企业运维告警入口，未配置时降级为日志 + MySQL 死信台账。
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      PRIVATE_KEY_PATH: /backend_file_service/private_key.pem
      PUBLIC_KEY_PATH: /backend_file_service/public_key.pem

      OPENSEARCH_HOST: http://opensearch:9200
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_TIMEOUT: 30
      OPENSEARCH_MAX_RETRIES: 3
      OPENSEARCH_FILE_INDEX: pcd_file_basic
      OPENSEARCH_CONTENT_INDEX: pcd_file_content

      MAX_CONCURRENT: 3
      OPERATION_TOKEN_EXPIRE_SECONDS: 3600
      # Sprint 0：Worker 由单一管理进程负责多进程/协程并发与优雅关闭。
      WORKER_PROCESSES: ${WORKER_PROCESSES:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-30}
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8719}
      WORKER_ADMIN_TOKEN: ${WORKER_ADMIN_TOKEN:-}
      # SkyWalking Python Agent
      SW_AGENT_NAME: PrivateCloudDisk-storage-worker
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_AGENT_LOGGING_LEVEL: INFO
    volumes:
      - uploads-data:/data/uploads
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8719/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -------------------- Git Repository Service --------------------
  git-service-backend:
    build: ./PrivateCloudDisk-git-service
    container_name: backend-git-service
    networks:
      - app-networks
    expose:
      - "8091"
      - "2222"
    ports:
      - "${GIT_SSH_HOST_PORT:-2222}:2222"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      platform-service-backend:
        condition: service_started
      file-service-backend:
        condition: service_started
    environment:
      GIT_HTTP_ADDR: :8091
      GIT_SSH_ADDR: :2222
      GIT_DATABASE_DSN: pcd_git:${GIT_DATASOURCE_PASSWORD:?必须设置 Git 数据库密码}@tcp(mysql:3306)/pcd_git?parseTime=true&multiStatements=true&charset=utf8mb4
      GIT_AUTO_MIGRATE: "true"
      GIT_MIGRATION_PATH: /app/db/migration/V1__git_core.sql
      GIT_REPO_ROOT: /data/git/repos
      GIT_SSH_HOST_KEY_PATH: /data/git/ssh/host_ed25519
      PLATFORM_SERVICE_URL: http://platform-service-backend:8081
      STORAGE_SERVICE_URL: http://file-service-backend:8000
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
      GIT_RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}:${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}@rabbitmq:5672/
      GIT_EVENT_EXCHANGE: pcd.git.event.exchange
      GIT_HTTP_CLONE_BASE_URL: ${GIT_HTTP_CLONE_BASE_URL:-http://localhost:8080/git}
      GIT_SSH_CLONE_HOST: ${GIT_SSH_CLONE_HOST:-localhost}
      GIT_SSH_CLONE_PORT: ${GIT_SSH_HOST_PORT:-2222}
      # [REQ-GIT-AUDIT-2.48/3.12/6.12~6.15] Git 协议自身的 pack、握手和认证保护；
      # 与 Storage Broker 的 GIT_OBJECT_* 限额分离，避免公开 Git 流量无上限占用容器。
      GIT_MAX_PROTOCOL_CONCURRENT: ${GIT_MAX_PROTOCOL_CONCURRENT:-64}
      GIT_MAX_PROTOCOL_REQUEST_BYTES: ${GIT_MAX_PROTOCOL_REQUEST_BYTES:-2147483648}
      GIT_MAX_PROTOCOL_RESPONSE_BYTES: ${GIT_MAX_PROTOCOL_RESPONSE_BYTES:-33554432}
      GIT_COMMAND_TIMEOUT: ${GIT_COMMAND_TIMEOUT:-10m}
      GIT_SSH_HANDSHAKE_TIMEOUT: ${GIT_SSH_HANDSHAKE_TIMEOUT:-15s}
      GIT_AUTH_FAILURE_LIMIT: ${GIT_AUTH_FAILURE_LIMIT:-10}
      GIT_AUTH_FAILURE_WINDOW: ${GIT_AUTH_FAILURE_WINDOW:-5m}
      GIT_AUTH_FAILURE_COOLDOWN: ${GIT_AUTH_FAILURE_COOLDOWN:-15m}
    volumes:
      - git-repo-cache:/data/git
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # -------------------- Plugin Service 插件生命周期与包仓库 --------------------
  plugin-service-backend:
    profiles: ["automation"]
    build: ./PrivateCloudDisk-plugin-service
    container_name: backend-plugin-service
    networks:
      - app-networks
    expose:
      - "8085"
    depends_on:
      mysql:
        condition: service_healthy
      platform-service-backend:
        condition: service_started
      client-registration-service:
        condition: service_healthy
    environment:
      PLUGIN_DATASOURCE_URL: jdbc:mysql://mysql:3306/pcd_plugin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PLUGIN_DATASOURCE_USERNAME: pcd_plugin
      PLUGIN_DATASOURCE_PASSWORD: ${PLUGIN_DATASOURCE_PASSWORD:?必须设置插件数据库密码}
      PLUGIN_STORAGE_PATH: /data/plugin-repo
      PLUGIN_STORAGE_BACKEND: local
      PLUGIN_RUNTIME_URL: ${PLUGIN_RUNTIME_URL:?必须配置专用沙箱节点 Runtime 地址}
      PLATFORM_SERVICE_URL: http://platform-service-backend:8081
      WORKFLOW_SERVICE_URL: http://workflow-service-backend:8087
      CLIENT_REGISTRATION_SERVICE_URL: http://client-registration-service:8089
      PLUGIN_SIGNING_PRIVATE_KEY_BASE64: ${PLUGIN_SIGNING_PRIVATE_KEY_BASE64:?必须设置本地插件 Ed25519 私钥}
      PLUGIN_SIGNING_PUBLIC_KEY_BASE64: ${PLUGIN_SIGNING_PUBLIC_KEY_BASE64:?必须设置本地插件 Ed25519 公钥}
      PLUGIN_SIGNING_KEY_ID: ${PLUGIN_SIGNING_KEY_ID:?必须设置本地插件签名密钥标识}
      PLUGIN_LOCAL_DOWNLOAD_GRANT_TTL_SECONDS: ${PLUGIN_LOCAL_DOWNLOAD_GRANT_TTL_SECONDS:-120}
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
    volumes:
      - plugin-repo:/data/plugin-repo
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # -------------------- Automation Service 事件匹配与可靠调度 --------------------
  automation-service-backend:
    profiles: ["automation"]
    build: ./PrivateCloudDisk-automation-service
    container_name: backend-automation-service
    networks:
      - app-networks
    expose:
      - "8084"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      plugin-service-backend:
        condition: service_healthy
    environment:
      AUTOMATION_DATASOURCE_URL: jdbc:mysql://mysql:3306/pcd_automation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      AUTOMATION_DATASOURCE_USERNAME: pcd_automation
      AUTOMATION_DATASOURCE_PASSWORD: ${AUTOMATION_DATASOURCE_PASSWORD:?必须设置自动化数据库密码}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}
      PLUGIN_SERVICE_URL: http://plugin-service-backend:8085
      PLUGIN_RUNTIME_URL: ${PLUGIN_RUNTIME_URL:?必须配置专用沙箱节点 Runtime 地址}
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
      PLUGIN_RUNTIME_TIMEOUT_SECONDS: ${PLUGIN_RUNTIME_TIMEOUT_SECONDS:-120}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # -------------------- Workflow Service DSL、能力中心与执行状态机 --------------------
  workflow-service-backend:
    profiles: ["automation"]
    build: ./PrivateCloudDisk-workflow-service
    container_name: backend-workflow-service
    networks:
      - app-networks
    expose:
      - "8087"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      platform-service-backend:
        condition: service_started
      plugin-service-backend:
        condition: service_healthy
    environment:
      WORKFLOW_DATASOURCE_URL: jdbc:mysql://mysql:3306/pcd_workflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      WORKFLOW_DATASOURCE_USERNAME: pcd_workflow
      WORKFLOW_DATASOURCE_PASSWORD: ${WORKFLOW_DATASOURCE_PASSWORD:?必须设置工作流数据库密码}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}
      PLATFORM_SERVICE_URL: http://platform-service-backend:8081
      PLUGIN_SERVICE_URL: http://plugin-service-backend:8085
      PLUGIN_RUNTIME_URL: ${PLUGIN_RUNTIME_URL:?必须配置专用沙箱节点 Runtime 地址}
      CLOUDFLOW_RUNTIME_URL: ${CLOUDFLOW_RUNTIME_URL:?必须配置 CloudFlow Runtime 地址}
      CLOUDFLOW_RUNTIME_COMPILE_URL: ${CLOUDFLOW_RUNTIME_COMPILE_URL:-http://cloudflow-runtime:8091/api/v1/compile}
      WORKFLOW_LEGACY_WORKER_ENABLED: "false"
      WORKFLOW_OUTBOX_POLL_DELAY_MS: ${WORKFLOW_OUTBOX_POLL_DELAY_MS:-500}
      SCHEDULER_SERVICE_URL: http://scheduler-service-backend:8088
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # -------------------- CloudFlow Rust 执行面 --------------------
  # 只加入 automation profile 和内部网络；Gateway 不暴露该端口，控制面通过内部令牌调用。
  cloudflow-runtime:
    profiles: ["automation"]
    build: ./PrivateCloudDisk-cloudflow-runtime
    container_name: backend-cloudflow-runtime
    networks:
      - app-networks
    expose:
      - "8091"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Tokio SocketAddr 需要显式 host；旧的 ":8091" 只适用于部分框架，Rust Runtime 使用 0.0.0.0。
      CLOUDFLOW_LISTEN_ADDRESS: 0.0.0.0:8091
      CLOUDFLOW_RUNTIME_MODE: production
      CLOUDFLOW_DATABASE_URL: ${CLOUDFLOW_DATABASE_URL:?必须设置包含专用账号的 CloudFlow MySQL DSN}
      CLOUDFLOW_DATASOURCE_USERNAME: pcd_cloudflow
      CLOUDFLOW_DATASOURCE_PASSWORD: ${CLOUDFLOW_DATASOURCE_PASSWORD:?必须设置 CloudFlow 数据库密码}
      CLOUDFLOW_RABBITMQ_URL: ${CLOUDFLOW_RABBITMQ_URL:?必须设置 CloudFlow RabbitMQ AMQP DSN}
      CLOUDFLOW_AGENT_LISTEN_ADDRESS: 0.0.0.0:50061
      CLOUDFLOW_CAPABILITY_AGENT_GRPC_URL: http://127.0.0.1:50061
      CLOUDFLOW_WORKFLOW_CAPABILITY_URL: http://workflow-service-backend:8087/internal/v1/capabilities/invoke
      CLOUDFLOW_WORKER_CONCURRENCY: ${CLOUDFLOW_WORKER_CONCURRENCY:-8}
      CLOUDFLOW_STALE_SECONDS: ${CLOUDFLOW_STALE_SECONDS:-180}
      CLOUDFLOW_ACTION_TIMEOUT_SECONDS: ${CLOUDFLOW_ACTION_TIMEOUT_SECONDS:-120}
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
      CLOUDFLOW_HTTP_MAX_CONCURRENCY: ${CLOUDFLOW_HTTP_MAX_CONCURRENCY:-32}
      CLOUDFLOW_CORS_ALLOWED_ORIGINS: ${CLOUDFLOW_CORS_ALLOWED_ORIGINS:-}
      RUST_LOG: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloudflow-runtime", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # -------------------- Scheduler Service 分布式 cron 与幂等 fire --------------------
  scheduler-service-backend:
    profiles: ["automation"]
    build: ./PrivateCloudDisk-scheduler-service
    container_name: backend-scheduler-service
    networks:
      - app-networks
    expose:
      - "8088"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      workflow-service-backend:
        condition: service_healthy
    environment:
      SCHEDULER_DATASOURCE_URL: jdbc:mysql://mysql:3306/pcd_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SCHEDULER_DATASOURCE_USERNAME: pcd_scheduler
      SCHEDULER_DATASOURCE_PASSWORD: ${SCHEDULER_DATASOURCE_PASSWORD:?必须设置调度数据库密码}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?必须设置 RabbitMQ 用户名}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?必须设置 RabbitMQ 密码}
      PCD_INTERNAL_SERVICE_TOKEN: ${PCD_INTERNAL_SERVICE_TOKEN:?必须设置服务间内部凭证}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  # ============================================================
  #                       IM 实时通信服务层
  # ============================================================

  # -------------------- IM 业务平台 HTTP 服务 --------------------
  im-platform-backend:
    build:
      context: ./PrivateCloudDisk-im
      dockerfile: im-platform/Dockerfile
    container_name: backend-im-platform
    networks:
      - app-networks
    expose:
      - "8088"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 基础配置
      IM_PLATFORM_PORT: 8088
      SPRING_PROFILES_ACTIVE: docker

      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      # Sprint 0 安全基线：IM 服务复用同一部署密钥，避免仓库内出现可直接使用的口令。
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在部署环境配置 MYSQL_ROOT_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?请在部署环境配置 RABBITMQ_PASSWORD}

      # JVM 内存限制
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/"
      # USER-DIRECTORY-20260810：IM 通过主业务公共用户目录获取公开资料，不访问用户表。
      PLATFORM_SERVICE_URL: http://platform-service-backend:8081
      # SkyWalking Agent
      SW_AGENT_NAME: PrivateCloudDisk-im-platform
      SW_AGENT_BACKEND: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_LOGGING_LEVEL: INFO
      SW_SAMPLE_RATE: "-1"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/im/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # -------------------- IM WebSocket 长连接推送服务 --------------------
  im-server-backend:
    build:
      context: ./PrivateCloudDisk-im
      dockerfile: im-server/Dockerfile
    container_name: backend-im-server
    networks:
      - app-networks
    expose:
      - "9090"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 基础配置
      IM_SERVER_HTTP_PORT: 8089
      NETTY_WS_PORT: 9090
      SPRING_PROFILES_ACTIVE: docker

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      # Netty 线程数
      NETTY_WORKER_THREADS: 8
      NETTY_BUSINESS_THREADS: 16

      # JVM 内存限制
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/"
      # SkyWalking Agent
      SW_AGENT_NAME: PrivateCloudDisk-im-server
      SW_AGENT_BACKEND: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_LOGGING_LEVEL: INFO
      SW_SAMPLE_RATE: "-1"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================
  #                       AI 智能服务层
  # ============================================================

  # -------------------- AI 智能服务（FastAPI + PyTorch/ONNX） --------------------
  ai-service-backend:
    build: ./PrivateCloudDisk-ai-service
    container_name: backend-ai-service
    networks:
      - app-networks
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 基础配置
      AI_SERVICE_PORT: 8001
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      # 业务服务回调
      BUSINESS_SERVICE_URL: http://gateway-service-backend:8080
      # 模型路径
      MODELS_PATH: /app/models
      # SkyWalking Python Agent
      SW_AGENT_NAME: PrivateCloudDisk-ai-service
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      SW_AGENT_NAMESPACE: PrivateCloudDisk
      SW_AGENT_LOGGING_LEVEL: INFO
    volumes:
      - ai-models:/app/models
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================================================
  #                         前端层
  # ============================================================

  # -------------------- Vue 前端（Nginx + Brotli + Gzip） --------------------
  frontend:
    build:
      context: ./PrivateCloudDisk-web
      args:
        # Vite 构建环境变量
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.hellomyservice.xyz/api/v1}
        VITE_IM_WS_URL: ${VITE_IM_WS_URL:-wss://ws.hellomyservice.xyz}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAADf7Z44g-izJGKIB}
        VITE_CHUNK_SIZE: ${VITE_CHUNK_SIZE:-5242880}
        VITE_MAX_CONCURRENT_UPLOADS: ${VITE_MAX_CONCURRENT_UPLOADS:-3}
        VITE_MAX_CONCURRENT_DOWNLOADS: ${VITE_MAX_CONCURRENT_DOWNLOADS:-4}
        VITE_UPLOAD_THRESHOLD: ${VITE_UPLOAD_THRESHOLD:-10485760}
    container_name: private-cloud-web
    networks:
      - app-networks
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt 证书持久化
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      # 客户端二进制下载文件（DMG / EXE / AppImage / DEB / RPM）
      # 方式 A（推荐 CI/CD）：bind mount，CI/CD 通过 rsync/scp 直接上传到宿主机 ./downloads/binaries/
      - ./downloads/binaries:/usr/share/nginx/html/downloads/binaries:ro
      # 方式 B（纯 Docker）：命名卷，通过 uploader 服务上传
      # - downloads-binaries:/usr/share/nginx/html/downloads/binaries:ro
    restart: always
    environment:
      - DOMAIN=hellomyservice.xyz          # 必填！替换为你的真实域名
      - MONITOR_INTERVAL=300            # 可选，默认 300 秒
    # 资源限制（防止内存泄漏导致宿主机 OOM）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # 日志轮转（防止 Docker 日志占满磁盘）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/log/nginx:rw,noexec,nosuid,size=128m   # 新增此行
    # 健康检查（通过 HTTP 端点验证 Nginx 是否正常运行）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      
  # ============================================================
  #                         证书管理
  # ============================================================

  # -------------------- Let's Encrypt 证书自动续期 --------------------
  certbot:
    image: certbot/dns-cloudflare:latest
    container_name: private-cloud-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./cloudflare.ini:/etc/cloudflare.ini:ro   # 注意是文件挂载
    environment:
      - CLOUDFLARE_EMAIL=
      - CLOUDFLARE_API_KEY= # 或使用令牌
    networks:
      - app-networks
    # 每 12 小时检查一次证书续期
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --deploy-hook \"echo reload\"; sleep 12h & wait $${!}; done;'"
    restart: always
