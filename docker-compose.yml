# ============================================================
# PrivateCloudDisk - Docker Compose 编排
# 
# 中间件 Dockerfile 统一管理在 PrivateCloudDisk-infra/ 目录下:
#   mysql/     redis/     rabbitmq/     minio/     opensearch/     apisix/
# ============================================================
version: '1.0'

networks:
  app-networks:
    driver: bridge

# 数据卷：持久化数据（统一定义在文件末尾 volumes: 节）

services:
  # ============================================================
  #                         中间件层
  # ============================================================

  # -------------------- MySQL 8.0 --------------------
  mysql:
    build: ./PrivateCloudDisk-infra/mysql
    container_name: project-mysql
    networks:
      - app-networks
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: private_cloud_disk
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- Redis 7 --------------------
  redis:
    build: ./PrivateCloudDisk-infra/redis
    container_name: project-redis
    networks:
      - app-networks
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- RabbitMQ 3 --------------------
  rabbitmq:
    build: ./PrivateCloudDisk-infra/rabbitmq
    container_name: project-rabbitmq
    networks:
      - app-networks
    expose:
      - "5672"
      - "15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- MinIO 对象存储 --------------------
  minio:
    build: ./PrivateCloudDisk-infra/minio
    container_name: project-minio
    networks:
      - app-networks
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- OpenSearch 2.10（含 analysis-ik） --------------------
  opensearch:
    build: ./PrivateCloudDisk-infra/opensearch
    container_name: project-opensearch
    networks:
      - app-networks
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MySecureP@ssw0rd
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    expose:
      - "9200"
      - "9600"
    restart: always

  # ============================================================
  #                         业务服务层
  # ============================================================

  # -------------------- SpringBoot 网关服务 --------------------
  gateway-service-backend:
    build: ./PrivateCloudDisk-gateway-service
    container_name: backend-gateway-service
    networks:
      - app-networks
    ports:
      - "8080:8080"
    depends_on:
      - platform-service-backend
      - file-service-backend
    environment:
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081
      FILE_SERVICE_URL: http://file-service-backend:8000
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
    restart: always

  # -------------------- SpringBoot 业务服务 --------------------
  platform-service-backend:
    build: ./PrivateCloudDisk-platform-service
    container_name: backend-platform-service
    networks:
      - app-networks
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/private_cloud_disk?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SECURITY_CAPTCHA_TURNSTILE_ENABLED: ${SECURITY_CAPTCHA_TURNSTILE_ENABLED:-false}
      SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY: ${SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY:-0x4AAAAAADf7Z-kpJMtKhi_3xlpjOjBm42w}
      SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME: ${SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME:-www.hellomyservice.xyz}
      SPRINGDOC_API_DOCS_ENABLED: true
      SPRINGDOC_SWAGGER_UI_ENABLED: true
    restart: always

  # -------------------- FastAPI 文件服务 --------------------
  file-service-backend:
    build: ./PrivateCloudDisk-shortage-service
    container_name: backend-file-service
    networks:
      - app-networks
    expose:
      - "8000"
    depends_on:
      - platform-service-backend
    environment:
      # OpenAPI 文档：生产环境默认关闭，调试时设为 true
      ENABLE_DOCS: ${ENABLE_DOCS:-false}

      FILE_UPLOAD_DIR: /data/uploads
      QUARANTINE_DIR: /data/uploads/quarantine
      REDIS_URL: redis://redis:6379/0
      BUSINESS_SERVICE_URL: http://gateway-service-backend:8080

      PRIVATE_KEY_PATH: /backend_file_service/private_key.pem
      PUBLIC_KEY_PATH: /backend_file_service/public_key.pem

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      OPENSEARCH_HOST: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: MySecureP@ssw0rd
      OPENSEARCH_USE_SSL: true
      OPENSEARCH_VERIFY_CERTS: false
      OPENSEARCH_TIMEOUT: 30
      OPENSEARCH_MAX_RETRIES: 3
      OPENSEARCH_FILE_INDEX: pcd_file_basic
      OPENSEARCH_CONTENT_INDEX: pcd_file_content

      MAX_CONCURRENT: 3
      OPERATION_TOKEN_EXPIRE_SECONDS: 3600
      MAX_REQUESTS_PER_OPERATION_TOKEN: 300
      RATE_PER_SEC: 10
      MAX_RANGE_BYTES: 104857600
      THUMBNAIL_TTL: 3600
      OPERATION_TOKEN_ISSUE_FILE_LIMIT: 10
      OPERATION_TOKEN_ISSUE_FILE_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_USER_LIMIT: 60
      OPERATION_TOKEN_DESTROY_USER_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_IP_LIMIT: 180
      OPERATION_TOKEN_DESTROY_IP_WINDOW_SECONDS: 60
    volumes:
      - uploads-data:/data/uploads
    restart: always

  # -------------------- FastAPI Worker 文件处理消费者 --------------------
  file-service-worker:
    build: ./PrivateCloudDisk-shortage-service
    container_name: backend-file-worker
    networks:
      - app-networks
    command: /backend_file_service/docker-entrypoint-worker.sh
    depends_on:
      - rabbitmq
      - redis
      - platform-service-backend
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      FILE_UPLOAD_DIR: /data/uploads
      REDIS_URL: redis://redis:6379/0
      BUSINESS_SERVICE_URL: http://gateway-service-backend:8080
      PRIVATE_KEY_PATH: /backend_file_service/private_key.pem
      PUBLIC_KEY_PATH: /backend_file_service/public_key.pem

      OPENSEARCH_HOST: https://opensearch:9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: MySecureP@ssw0rd
      OPENSEARCH_USE_SSL: true
      OPENSEARCH_VERIFY_CERTS: false
      OPENSEARCH_TIMEOUT: 30
      OPENSEARCH_MAX_RETRIES: 3
      OPENSEARCH_FILE_INDEX: pcd_file_basic
      OPENSEARCH_CONTENT_INDEX: pcd_file_content

      MAX_CONCURRENT: 3
      OPERATION_TOKEN_EXPIRE_SECONDS: 3600
    volumes:
      - uploads-data:/data/uploads
    restart: always

  # ============================================================
  #                       IM 实时通信服务层
  # ============================================================

  # -------------------- IM 业务平台 HTTP 服务 --------------------
  im-platform-backend:
    build:
      context: ./PrivateCloudDisk-im
      dockerfile: im-platform/Dockerfile
    container_name: backend-im-platform
    networks:
      - app-networks
    expose:
      - "8088"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 基础配置
      IM_PLATFORM_PORT: 8088
      SPRING_PROFILES_ACTIVE: docker

      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      # JVM 内存限制
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/im/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # -------------------- IM WebSocket 长连接推送服务 --------------------
  im-server-backend:
    build:
      context: ./PrivateCloudDisk-im
      dockerfile: im-server/Dockerfile
    container_name: backend-im-server
    networks:
      - app-networks
    expose:
      - "9090"
    ports:
      # WebSocket 端口需要对外暴露（前端直接连接）
      - "9090:9090"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 基础配置
      IM_SERVER_HTTP_PORT: 8089
      NETTY_WS_PORT: 9090
      SPRING_PROFILES_ACTIVE: docker

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      # Netty 线程数
      NETTY_WORKER_THREADS: 8
      NETTY_BUSINESS_THREADS: 16

      # JVM 内存限制
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================
  #                         前端层
  # ============================================================

  # -------------------- Vue 前端（Nginx + Brotli + Gzip） --------------------
  frontend:
    build:
      context: ./PrivateCloudDisk-web
      args:
        # Vite 构建环境变量
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAADf7Z44g-izJGKIB}
        VITE_CHUNK_SIZE: ${VITE_CHUNK_SIZE:-5242880}
        VITE_MAX_CONCURRENT_UPLOADS: ${VITE_MAX_CONCURRENT_UPLOADS:-3}
        VITE_MAX_CONCURRENT_DOWNLOADS: ${VITE_MAX_CONCURRENT_DOWNLOADS:-4}
        VITE_UPLOAD_THRESHOLD: ${VITE_UPLOAD_THRESHOLD:-10485760}
    container_name: private-cloud-web
    networks:
      - app-networks
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Let's Encrypt 证书持久化
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      # 客户端二进制下载文件（DMG / EXE / AppImage / DEB / RPM）
      # 方式 A（推荐 CI/CD）：bind mount，CI/CD 通过 rsync/scp 直接上传到宿主机 ./downloads/binaries/
      - ./downloads/binaries:/usr/share/nginx/html/downloads/binaries:ro
      # 方式 B（纯 Docker）：命名卷，通过 uploader 服务上传
      # - downloads-binaries:/usr/share/nginx/html/downloads/binaries:ro
    depends_on:
      gateway-service-backend:
        condition: service_started
    restart: always
    # 资源限制（防止内存泄漏导致宿主机 OOM）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # 日志轮转（防止 Docker 日志占满磁盘）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=16m
    # 健康检查（通过 HTTP 端点验证 Nginx 是否正常运行）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      
  # ============================================================
  #                         证书管理
  # ============================================================

  # -------------------- Let's Encrypt 证书自动续期 --------------------
  certbot:
    image: certbot/certbot:latest
    container_name: private-cloud-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-networks
    # 每 12 小时检查一次证书续期
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --deploy-hook \"nginx -s reload\"; sleep 12h & wait $${!}; done;'"
    restart: always

  # ============================================================
  #                 企业级中间件扩展层 (新增)
  # ============================================================

  # -------------------- Nacos 服务注册发现 + 配置中心 --------------------
  nacos:
    build: ./PrivateCloudDisk-infra/nacos
    container_name: project-nacos
    networks:
      - app-networks
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: "123456"
      MYSQL_SERVICE_DB_PARAM: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
    volumes:
      - nacos-logs:/home/nacos/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -------------------- Sentinel 流量控制 Dashboard --------------------
  sentinel:
    build: ./PrivateCloudDisk-infra/sentinel
    container_name: project-sentinel
    networks:
      - app-networks
    ports:
      - "8858:8858"
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dsentinel.dashboard.auth.username=sentinel -Dsentinel.dashboard.auth.password=sentinel123"
    restart: always

  # -------------------- Seata Server 分布式事务协调器 --------------------
  seata:
    build: ./PrivateCloudDisk-infra/seata
    container_name: project-seata
    networks:
      - app-networks
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: db
      SEATA_IP: seata
    volumes:
      - ./PrivateCloudDisk-infra/seata/application.yml:/seata-server/resources/application.yml
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7091/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -------------------- XXL-Job 分布式任务调度中心 --------------------
  xxl-job:
    build: ./PrivateCloudDisk-infra/xxl-job
    container_name: project-xxl-job
    networks:
      - app-networks
    ports:
      - "8089:8089"
    environment:
      PARAMS: "--server.port=8089 --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=123456 --xxl.job.accessToken=xxl-job-access-token-2024"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/xxl-job-admin/toLogin"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -------------------- SkyWalking OAP 链路追踪后端 --------------------
  skywalking-oap:
    build: ./PrivateCloudDisk-infra/skywalking
    container_name: project-skywalking-oap
    networks:
      - app-networks
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      SW_ES_USER: elastic
      SW_ES_PASSWORD: elastic123
      JAVA_OPTS: "-Xms512m -Xmx512m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12800/healthCheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -------------------- SkyWalking UI 链路追踪仪表板 --------------------
  skywalking-ui:
    build: ./PrivateCloudDisk-infra/skywalking-ui
    container_name: project-skywalking-ui
    networks:
      - app-networks
    ports:
      - "8082:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      skywalking-oap:
        condition: service_healthy
    restart: always

  # -------------------- Elasticsearch 日志存储引擎 --------------------
  elasticsearch:
    build: ./PrivateCloudDisk-infra/elasticsearch
    container_name: project-elasticsearch
    networks:
      - app-networks
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: elastic123
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "elastic:elastic123", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # -------------------- Kibana 日志可视化仪表板 --------------------
  kibana:
    build: ./PrivateCloudDisk-infra/kibana
    container_name: project-kibana
    networks:
      - app-networks
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: elastic123
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always

  # -------------------- Logstash 日志聚合管道 --------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: project-logstash
    networks:
      - app-networks
    ports:
      - "5044:5044"
    volumes:
      - ./PrivateCloudDisk-infra/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always

  # -------------------- Loki 轻量级日志聚合 (Grafana 集成) --------------------
  loki:
    image: grafana/loki:2.9.10
    container_name: project-loki
    networks:
      - app-networks
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./PrivateCloudDisk-infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    restart: always

  # -------------------- Prometheus 指标监控 --------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: project-prometheus
    networks:
      - app-networks
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./PrivateCloudDisk-infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./PrivateCloudDisk-infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    restart: always

  # -------------------- Grafana 监控可视化仪表板 --------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: project-grafana
    networks:
      - app-networks
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./PrivateCloudDisk-infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: always

  # -------------------- Canal MySQL CDC 数据同步 --------------------
  canal:
    build: ./PrivateCloudDisk-infra/canal
    container_name: project-canal
    networks:
      - app-networks
    ports:
      - "11111:11111"
    volumes:
      - ./PrivateCloudDisk-infra/canal/canal.properties:/home/admin/canal-server/conf/canal.properties
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  # ============================================================
  #                 监控 Exporter 层 (新增)
  # ============================================================

  # -------------------- Redis Exporter --------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: project-redis-exporter
    networks:
      - app-networks
    ports:
      - "9121:9121"
    command:
      - '--redis.addr=redis://redis:6379'
    restart: always

  # -------------------- MySQL Exporter --------------------
  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: project-mysql-exporter
    networks:
      - app-networks
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "root:123456@(mysql:3306)/"
    restart: always

  # -------------------- RabbitMQ Exporter --------------------
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:v1.0.0-RC19
    container_name: project-rabbitmq-exporter
    networks:
      - app-networks
    ports:
      - "9419:9419"
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      PUBLISH_PORT: "9419"
    restart: always

  # ============================================================
  #                 数据卷 (新增)
  # ============================================================
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  uploads-data:
  opensearch-data:
  minio-data:
  downloads-binaries:
  nacos-logs:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  loki-data: