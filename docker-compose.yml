# 版本定义
version: '1.0'

networks:
  app-networks:
    driver: bridge

# 数据卷：持久化数据（删除容器不丢数据）
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  uploads-data:

# 定义所有服务（容器）
services:
  # 1. MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: project-mysql
    networks:
      - app-networks
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: private_cloud_disk # 自动创建数据库
    volumes:
      - mysql-data:/var/lib/mysql # 数据持久化（删容器不丢数据）
      # 2. 自动执行本地SQL（初始化你的所有表+数据）
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:latest
    container_name: project-redis
    networks:
      - app-networks
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    hostname: redis

  rabbitmq:
    image: rabbitmq:latest
    container_name: project-rabbitmq
    networks:
      - app-networks
    restart: always
    expose:
      - "5672"    # 程序连接端口
      - "15672"  # 管理面板端口
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
       - rabbitmq-data:/var/lib/rabbitmq
  gateway-service-backend:
    build: ./PrivateCloudDisk-gateway-service
    container_name: backend-gateway-service
    networks:
      - app-networks
    restart: always
    expose:
      - "8080"
    depends_on:
      - platform-service-backend
      - file-service-backend
    environment:
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081
      FILE_SERVICE_URL: http://file-service-backend:8000
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis

  # 2. SpringBoot 后端业务服务
  platform-service-backend:
    build: ./PrivateCloudDisk-platform-service # 自动读取前端Dockerfile
    container_name: backend-platform-service
    networks:
      - app-networks
    restart: always
    expose:
      - "8081"
    depends_on:
      - mysql
      - redis
      - rabbitmq
    # 开发环境热重载
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 连接数据库：用服务名访问（Docker内部网络）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/private_cloud_disk?useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SECURITY_CAPTCHA_TURNSTILE_ENABLED: ${SECURITY_CAPTCHA_TURNSTILE_ENABLED:-false}
      SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY: ${SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY:-0x4AAAAAADf7Z-kpJMtKhi_3xlpjOjBm42w}
      SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME: ${SECURITY_CAPTCHA_TURNSTILE_EXPECTED_HOSTNAME:-www.hellomyservice.xyz}
  
  # 3. FastAPI 后端文件服务
  file-service-backend:
    build: ./PrivateCloudDisk-shortage-service
    container_name: backend-file-service
    networks:
      - app-networks
    restart: always
    expose:
      - "8000"
    depends_on:
      - platform-service-backend
    environment:
      FILE_UPLOAD_DIR: /data/uploads # 文件存储目录
      REDIS_URL: redis://redis:6379/0
      BUSINESS_SERVICE_URL: http://platform-service-backend:8081

      PRIVATE_KEY_PATH: /backend_file_service/private_key.pem
      PUBLIC_KEY_PATH: /backend_file_service/public_key.pem

      MAX_CONCURRENT: 3
      OPERATION_TOKEN_EXPIRE_SECONDS: 3600
      MAX_REQUESTS_PER_OPERATION_TOKEN: 300
      RATE_PER_SEC: 10
      MAX_RANGE_BYTES: 104857600
      THUMBNAIL_TTL: 3600
      OPERATION_TOKEN_ISSUE_FILE_LIMIT: 10
      OPERATION_TOKEN_ISSUE_FILE_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_USER_LIMIT: 60
      OPERATION_TOKEN_DESTROY_USER_WINDOW_SECONDS: 60
      OPERATION_TOKEN_DESTROY_IP_LIMIT: 180
      OPERATION_TOKEN_DESTROY_IP_WINDOW_SECONDS: 60
    volumes:
      - uploads-data:/data/uploads # 文件持久化（删容器不丢数据）

  # 4. Vue 前端服务
  frontend:
    build:
      context: ./PrivateCloudDisk-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAADf7Z44g-izJGKIB}
        VITE_CHUNK_SIZE: ${VITE_CHUNK_SIZE:-5242880}
        VITE_MAX_CONCURRENT_UPLOADS: ${VITE_MAX_CONCURRENT_UPLOADS:-3}
        VITE_MAX_CONCURRENT_DOWNLOADS: ${VITE_MAX_CONCURRENT_DOWNLOADS:-4}
        VITE_UPLOAD_THRESHOLD: ${VITE_UPLOAD_THRESHOLD:-10485760}
    container_name: private-cloud-web
    networks:
      - app-networks
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # certbot HTTP-01 验证文件目录
      - ./certbot/www:/var/www/certbot

      # Let's Encrypt 证书目录
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - gateway-service-backend

  certbot:
    image: certbot/certbot:latest
    container_name: private-cloud-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-networks