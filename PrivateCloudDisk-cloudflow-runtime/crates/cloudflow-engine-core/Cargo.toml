[package]
name = "cloudflow-engine-core"
version = "0.1.0"
edition = "2021"
description = "CloudFlow 统一执行核心：Workflow IR、领域 AST、表达式子系统、IR 契约校验、执行语义核心、统一调度驱动与内存调试执行面（纯 Rust，无数据库/Redis/MQ/HTTP 依赖）"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = "0.4"
miette = { version = "7", features = ["fancy"] }
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lib]
name = "cloudflow_engine_core"
path = "src/lib.rs"
