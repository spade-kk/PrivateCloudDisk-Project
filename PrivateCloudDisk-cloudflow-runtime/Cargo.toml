[package]
name = "pcd-cloudflow-runtime"
version = "0.1.0"
edition = "2021"
description = "PrivateCloudDisk CloudFlow DSL compiler and execution runtime"
license = "Apache-2.0"

[workspace]
resolver = "2"

[lib]
name = "cloudflow_runtime"
path = "src/lib.rs"

[[bin]]
name = "cloudflow-runtime"
path = "src/main.rs"

[[bin]]
name = "cloudflowc"
path = "src/bin/cloudflowc.rs"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
