[package]
name = "pcd-cloudflow-runtime"
version = "0.1.0"
edition = "2021"
description = "PrivateCloudDisk CloudFlow DSL compiler and execution runtime"
license = "Apache-2.0"

[workspace]
resolver = "2"

[lib]
name = "cloudflow_runtime"
path = "src/lib.rs"

[[bin]]
name = "cloudflow-runtime"
path = "src/main.rs"

[[bin]]
name = "cloudflowc"
path = "src/bin/cloudflowc.rs"

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
lapin = "2.5"
miette = { version = "7", features = ["fancy"] }
pest = "2"
pest_derive = "2"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
http-body-util = "0.1"
