[package]
name = "pcd-cloudflow-runtime"
version = "0.1.0"
edition = "2021"
description = "PrivateCloudDisk CloudFlow DSL compiler and execution runtime"
license = "Apache-2.0"

[workspace]
resolver = "2"
members = [
    "crates/cloudflow-agent",
    "crates/cloudflow-engine-core",
    "crates/cloudflow-ls",
]

# [CLOUDFLOW-LS-ARCH-001] 编译器前端（Parser / YAML / AST / semantic）是可复用的
# 编辑期能力；生产 Runtime 服务面（HTTP、MQ、持久化、gRPC Agent）保持显式 feature
# 隔离。这样 cloudflow-ls 复用同一份编译器实现，却不会把执行 Runtime 链接进语言服务。
[features]
default = ["runtime-service"]
compiler-api = []
runtime-service = []

[lib]
name = "cloudflow_runtime"
path = "src/lib.rs"

[[bin]]
name = "cloudflow-runtime"
path = "src/main.rs"
required-features = ["runtime-service"]

[[bin]]
name = "cloudflowc"
path = "src/bin/cloudflowc.rs"

# [19.18/19.22] 编译性能基准：稳定版 harness（无 criterion 依赖）。
[[bench]]
name = "compile_bench"
harness = false

[dependencies]
async-trait = "0.1"
cloudflow-agent = { path = "crates/cloudflow-agent" }
cloudflow-engine-core = { path = "crates/cloudflow-engine-core" }
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
lapin = "2.5"
miette = { version = "7", features = ["fancy"] }
pest = "2"
pest_derive = "2"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }


[dev-dependencies]
http-body-util = "0.1"
